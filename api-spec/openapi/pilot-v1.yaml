            schema:
              $ref: '#/components/schemas/ActualizacionConfiguracionContable'
      responses:
        '200':
          description: Configuración actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: la empresa no tiene configuración contable."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-006: una cuenta no existe en la empresa, está inactiva o no es de detalle; PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Reglas de contabilización (ADR-020, ADR-035): cuenta por tipo de operación × categoría × código ---
  /contabilidad/reglas-contabilizacion:
    get:
      operationId: listarReglasContabilizacion
      tags: [reglasContabilizacion]
      x-rol-minimo: auditor
      summary: Lista las reglas de contabilización
      description: >-
        Devuelve las reglas de contabilización de la empresa, sin paginar, ordenadas por tipo de operación, categoría y
        código. El filtro tipoOperacion es opcional. Cada regla trae su version, que es el valor que se envía entre
        comillas como If-Match al editarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/TipoOperacionFiltro'
      responses:
        '200':
          description: Reglas ordenadas por tipo de operación, categoría y código.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReglaContabilizacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma de los parámetros (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/reglas-contabilizacion/{reglaId}:
    put:
      operationId: actualizarReglaContabilizacion
      tags: [reglasContabilizacion]
      x-rol-minimo: contador
      summary: Reemplaza una regla de contabilización
      description: >-
        Reemplaza la cuenta y el estado de una regla; el tipo de operación, la categoría y el código no cambian.
        No existe GET individual, así que If-Match es la version de la regla (leída del listado) entre comillas, con el
        mismo formato del ETag; la respuesta devuelve el nuevo ETag. Una regla activa exige una cuenta (PLT-002 si
        activa es true y cuentaId es nulo, ADR-035); la cuenta debe existir, estar activa y ser de detalle (CON-006).
        Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/ReglaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Cuenta y estado de la regla.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionReglaContabilizacion'
      responses:
        '200':
          description: Regla actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReglaContabilizacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-006: la cuenta no existe en la empresa, está inactiva o no es de detalle; PLT-002: validación de forma (incluye errores), o activa es true con cuentaId nulo."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Libro Diario (CLAUDE.md §10.1, §11.2, ADR-036): las cinco operaciones van en la etiqueta asientos ---
  /contabilidad/asientos:
    post:
      operationId: registrarAsiento
      tags: [asientos]
      x-rol-minimo: contador
      summary: Registra un asiento manual
      description: >-
        Registra un asiento manual del Libro Diario en una sola transacción: expande el IVA de las líneas que lo llevan
        (CLAUDE.md §11.2), valida la partida doble, asigna el número correlativo, guarda cabecera y líneas y mayoriza
        los saldos (ADR-018); o se guarda todo o no se guarda nada. Exige Idempotency-Key: repetir la misma clave con el
        mismo cuerpo devuelve la respuesta original con Idempotency-Replayed true. Un asiento guardado es inmutable
        (ADR-019). Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Fecha, concepto, modo de precio opcional y líneas del asiento.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoAsiento'
      responses:
        '201':
          description: Asiento contabilizado. Si es la repetición de una petición idempotente, es la respuesta original.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos (incluye un monto enviado como número)."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — PLT-008: otra petición con la misma Idempotency-Key está en proceso; reintentar."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-001: menos de dos líneas; CON-002: una línea con Debe y Haber a la vez o ninguno; CON-003: monto negativo o con más de 2 decimales; CON-004: totales en cero; CON-005: Σ Debe ≠ Σ Haber (incluye diferencia); CON-006: cuenta inexistente, inactiva, de otra empresa o que no es de detalle; CON-007: fecha obligatoria y no futura; CON-013: \"lleva IVA\" sobre una cuenta de IVA; CON-017: no hay tasa de IVA vigente a la fecha del asiento; PLT-002: validación de forma (concepto obligatorio o de más de 500 caracteres, más de 200 líneas; incluye errores); PLT-005: Idempotency-Key reutilizada con otro cuerpo."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-006: falta el header Idempotency-Key."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    get:
      operationId: listarAsientos
      tags: [asientos]
      x-rol-minimo: auditor
      summary: Libro Diario paginado
      description: >-
        Lista los asientos de la empresa (Libro Diario) paginados por cursor y ordenados por año y número ascendentes.
        Los filtros son opcionales y se combinan: desde y hasta (fecha contable, ambos inclusive), anio, numero, origen,
        estado y cuentaId (asientos con alguna línea en esa cuenta). El listado devuelve el resumen sin líneas; el detalle
        está en la consulta individual. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/AnioFiltro'
        - $ref: '#/components/parameters/NumeroAsientoFiltro'
        - $ref: '#/components/parameters/OrigenAsientoFiltro'
        - $ref: '#/components/parameters/EstadoAsientoFiltro'
        - $ref: '#/components/parameters/CuentaIdFiltro'
      responses:
        '200':
          description: Página de asientos en orden de año y número.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAsientos'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma de los parámetros, o desde es posterior a hasta (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/asientos/vista-previa:
    post:
      operationId: previsualizarAsiento
      tags: [asientos]
      x-rol-minimo: contador
      summary: Vista previa de un asiento sin guardarlo
      description: >-
        Expande el IVA de las líneas que lo llevan y calcula los totales y la diferencia sin guardar nada ni numerar el
        asiento; no exige Idempotency-Key. Responde 200 aunque el asiento no cuadre (cuadra false y diferencia distinta de
        cero, ADR-036), para que el frontend valide la partida doble sobre las líneas expandidas por el backend. Solo
        responde 422 si no se puede expandir. Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      requestBody:
        required: true
        description: Mismo cuerpo que el registro del asiento.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoAsiento'
      responses:
        '200':
          description: Líneas expandidas, totales, diferencia e indicador de que cuadra.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPreviaAsiento'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos (incluye un monto enviado como número)."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — solo si no se puede expandir: CON-002: una línea con Debe y Haber a la vez o ninguno; CON-003: monto negativo o con más de 2 decimales; CON-006: cuenta inexistente, inactiva, de otra empresa o que no es de detalle; CON-007: fecha obligatoria y no futura; CON-013: \"lleva IVA\" sobre una cuenta de IVA; CON-017: no hay tasa de IVA vigente a la fecha; PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/asientos/{asientoId}:
    get:
      operationId: obtenerAsiento
      tags: [asientos]
      x-rol-minimo: auditor
      summary: Consulta un asiento con sus líneas
      description: >-
        Devuelve un asiento con todas sus líneas. No lleva ETag porque un asiento guardado es inmutable salvo su paso a
        REVERTIDO (ADR-019). Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/AsientoIdRuta'
      responses:
        '200':
          description: Asiento con sus líneas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
