  /integraciones/operaciones/{entradaId}:
    get:
      operationId: obtenerEntradaBitacora
      tags: [bitacoraOperaciones]
      x-rol-minimo: auditor
      summary: Detalle de una entrada de la bitácora
      description: >-
        Devuelve el detalle de una entrada de la bitácora: el resumen normalizado de una operación aceptada, o
        el Problem Details del rechazo, sin datos personales. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/EntradaIdRuta'
      responses:
        '200':
          description: Detalle de la entrada de bitácora.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleEntradaBitacora'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: la entrada no existe o no pertenece a la empresa activa."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /integraciones/operaciones/exportacion:
    get:
      operationId: exportarBitacora
      tags: [bitacoraOperaciones]
      x-rol-minimo: auditor
      summary: Exporta la bitácora de operaciones
      description: >-
        Exporta la bitácora de GET /integraciones/operaciones en el formato pedido, con los mismos filtros salvo
        limite y cursor; desde y hasta son obligatorios (ADR-038, ADR-039 §6). La respuesta es el archivo, con
        Content-Disposition attachment. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/Formato'
        - $ref: '#/components/parameters/DesdeRecepcionExportacion'
        - $ref: '#/components/parameters/HastaRecepcionExportacion'
        - $ref: '#/components/parameters/ResultadoBitacoraFiltro'
        - $ref: '#/components/parameters/SistemaOrigenFiltro'
      responses:
        '200':
          description: Archivo de la bitácora en el formato pedido.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Content-Disposition:
              $ref: '#/components/headers/Content-Disposition'
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: desde es posterior a hasta, o formato desconocido (ADR-038 §10)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  # --- Esquemas de seguridad ---
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso JWT emitido por Keycloak (OIDC con PKCE) para usuarios de la web.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_xxxx.secreto
      description: API key de integración con formato pk_xxxx.secreto, usada por n8n; la empresa se deriva de la clave.

  # --- Esquemas reutilizables ---
  schemas:
    Monto:
      type: string
      pattern: '^\d{1,17}(\.\d{1,2})?$'
      examples: ['123.45']
      description: >-
        Monto en USD no negativo como cadena decimal con máximo 2 decimales (ADR-013); nunca número JSON.
        El servidor siempre responde con exactamente 2 decimales.
    MontoConSigno:
      type: string
      pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      examples: ['-10.50']
      description: >-
        Monto en USD que puede ser negativo (p. ej. una diferencia), como cadena decimal con máximo
        2 decimales (ADR-013). El servidor siempre responde con exactamente 2 decimales.
    Uuid:
      type: string
      format: uuid
      description: Identificador UUID (versión 7 generado por la aplicación, ADR-010).
    Fecha:
      type: string
      format: date
      description: Fecha calendario ISO-8601 (AAAA-MM-DD); las fechas contables son de hora de El Salvador.
    FechaHora:
      type: string
      format: date-time
      description: Instante ISO-8601 en UTC.
    ErrorCampo:
      type: object
      description: Detalle de un error de validación asociado a un campo.
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          description: Ruta del campo con error dentro del cuerpo o de los parámetros.
        mensaje:
          type: string
          description: Mensaje de error en español.
    ProblemDetails:
      type: object
      description: Error según RFC 9457 (application/problem+json) con extensiones de Pilot.
      required: [type, title, status, codigo]
      properties:
        type:
          type: string
          description: URI que identifica el tipo de problema; about:blank si no hay uno específico.
        title:
          type: string
          description: Resumen corto del problema, en español.
        status:
          type: integer
          description: Código de estado HTTP de la respuesta.
        detail:
          type: string
          description: Explicación del problema para esta ocurrencia; sin trazas ni datos internos.
        instance:
          type: string
          description: URI o identificador de la ocurrencia concreta del problema.
        codigo:
          type: string
          pattern: '^(PLT|CON|INT)-\d{3}$'
          description: Código de negocio con prefijo del módulo (PLT plataforma, CON contabilidad, INT integración).
        errores:
          type: array
          description: Errores de validación por campo; solo en fallos de validación.
          items:
            $ref: '#/components/schemas/ErrorCampo'
        diferencia:
          $ref: '#/components/schemas/MontoConSigno'
          description: Diferencia Σ Debe − Σ Haber; solo en descuadres y cobros que no cuadran.
        operacionId:
          $ref: '#/components/schemas/Uuid'
          description: Operación externa ya contabilizada; solo en 409 INT-004 (ADR-039 §5).
        asientoId:
          $ref: '#/components/schemas/Uuid'
          description: Asiento generado por la operación ya contabilizada; solo en 409 INT-004 (ADR-039 §5).
    PaginaCursor:
      type: object
      description: Metadatos de paginación por cursor; los listados lo extienden con su arreglo de elementos.
      properties:
        siguienteCursor:
          type: [string, 'null']
          description: Cursor opaco para pedir la página siguiente; nulo cuando no hay más resultados.
    # --- Enumeraciones con nombre (se reutilizan en lugar de repetirse en línea) ---
    Rol:
      type: string
      enum: [admin_empresa, contador, auditor]
      description: Rol del usuario dentro de la empresa (CLAUDE.md §14.2). El rol técnico integracion no aplica a usuarios.
    TipoEmpresa:
      type: string
      enum: [PERSONAL, JURIDICA]
      description: Tipo de empresa; en 1.0 solo existe PERSONAL, JURIDICA es de la edición Enterprise (ADR-029).
    EdicionAplicacion:
      type: string
      enum: [COMUNITARIA, ENTERPRISE]
      description: Edición a la que pertenece la app; solo las COMUNITARIA se pueden instalar en 1.0 (ADR-030).
    EstadoAplicacion:
      type: string
      enum: [INSTALADA, DISPONIBLE, BLOQUEADA_ENTERPRISE]
      description: Estado de la app para la empresa activa (ADR-030).
    EstadoEmpresa:
      type: string
      enum: [ACTIVA, INACTIVA]
      description: Estado de la empresa; coincide con el CHECK de la columna estado en la base de datos.
    AlcanceApiKey:
      type: string
      enum: ['integracion:operaciones']
      description: Alcance que otorga una API key; en 1.0 solo el webhook de operaciones de n8n.

    # --- Usuario actual (ADR-028) ---
    Membresia:
      type: object
      description: Pertenencia activa del usuario a una empresa con su rol.
      required: [empresaId, nombreEmpresa, tipoEmpresa, rol]
      properties:
        empresaId:
          $ref: '#/components/schemas/Uuid'
        nombreEmpresa:
          type: string
          description: Nombre de la empresa.
        tipoEmpresa:
          $ref: '#/components/schemas/TipoEmpresa'
        rol:
          $ref: '#/components/schemas/Rol'
    UsuarioActual:
      type: object
      description: Usuario autenticado y sus membresías activas.
      required: [id, correo, nombre, telefono, recomendacionesCorreo, membresias]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        correo:
          type: string
          description: Correo del usuario, verificado en Keycloak (dato personal; se enmascara en logs).
        nombre:
          type: string
          description: Nombre completo del usuario.
        telefono:
          type: string
          pattern: '^\+503[0-9]{8}$'
          description: Teléfono de El Salvador con prefijo +503 (dato personal; se enmascara en logs).
        recomendacionesCorreo:
          type: boolean
          description: Consentimiento vigente para recibir recomendaciones por correo (ADR-028).
        membresias:
          type: array
          description: Empresas a las que el usuario pertenece con membresía activa.
          items:
            $ref: '#/components/schemas/Membresia'
    ActualizacionUsuarioActual:
      type: object
      description: Cambio del consentimiento de correos; nombre, correo y teléfono vienen de Keycloak y no se editan aquí.
      required: [recomendacionesCorreo]
      properties:
        recomendacionesCorreo:
          type: boolean
          description: true da el consentimiento; false lo retira.

    # --- Empresa (ADR-029) ---
    Empresa:
      type: object
      description: >-
        Espacio de trabajo activo de la sesión. En la versión abierta es la empresa PERSONAL del usuario, sin datos
        empresariales (ADR-032).
      required: [id, tipo, nombre, estado, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoEmpresa'
        nombre:
          type: string
          description: Nombre del espacio de trabajo; al crearlo es el nombre del usuario.
        estado:
          $ref: '#/components/schemas/EstadoEmpresa'
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
    ActualizacionEmpresa:
      type: object
      description: >-
        Dato editable del espacio de trabajo: solo el nombre. Nombre comercial, NIT y NRC no se capturan en la
        versión abierta (ADR-031, ADR-032); son de la edición Enterprise.
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 250
          description: Nuevo nombre del espacio de trabajo.

    # --- Catálogo de apps (ADR-030) ---
    AplicacionCatalogo:
      type: object
      description: App del catálogo con su estado para la empresa activa.
      required: [codigo, nombre, descripcion, edicion, estado, instaladaEn]
      properties:
        codigo:
          type: string
          description: Identificador estable de la app; también es el prefijo de sus rutas.
        nombre:
          type: string
          description: Nombre visible de la app.
        descripcion:
          type: [string, 'null']
          description: Descripción corta de la app.
        edicion:
          $ref: '#/components/schemas/EdicionAplicacion'
        estado:
          $ref: '#/components/schemas/EstadoAplicacion'
        instaladaEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de la instalación (FechaHora); nulo si la app no está instalada.

    # --- API keys (secreto visible solo al crearlas) ---
    ApiKey:
      type: object
      description: API key de integración. Nunca incluye el secreto ni su hash.
      required: [id, nombre, prefijo, alcances, expiraEn, revocadaEn, ultimoUsoEn, creadaEn]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          description: Nombre descriptivo, p. ej. "n8n producción".
        prefijo:
          type: string
          description: Parte visible de la clave (pk_xxxx) para identificarla.
        alcances:
          type: array
          description: Alcances que otorga la clave.
          items:
            $ref: '#/components/schemas/AlcanceApiKey'
        expiraEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de expiración (FechaHora); nulo si no vence.
        revocadaEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de revocación (FechaHora); nulo si está vigente.
        ultimoUsoEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC del último uso (FechaHora); nulo si nunca se usó.
        creadaEn:
          $ref: '#/components/schemas/FechaHora'
    PaginaApiKeys:
      description: Página de API keys sin secretos.
      allOf:
        - $ref: '#/components/schemas/PaginaCursor'
        - type: object
          required: [elementos]
          properties:
            elementos:
              type: array
              description: API keys de la página.
              items:
                $ref: '#/components/schemas/ApiKey'
    NuevaApiKey:
      type: object
      description: Datos para crear una API key.
      required: [nombre, alcances, expiraEn]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre descriptivo de la clave.
        alcances:
          type: array
          minItems: 1
          description: >-
            Alcances que tendrá la clave. Sin repetidos: el backend rechaza duplicados con 422 PLT-002.
          items:
            $ref: '#/components/schemas/AlcanceApiKey'
        expiraEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de expiración (FechaHora); null para una clave que no vence.
    ApiKeyCreada:
      description: API key recién creada; es la única respuesta que incluye el secreto.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secreto]
          properties:
            secreto:
              type: string
              description: >-
                Secreto completo (pk_xxxx.secreto). Se muestra una sola vez y no se puede recuperar;
                el servidor guarda únicamente su hash Argon2id.

    # --- Contabilidad: enumeraciones y catálogo de cuentas (CLAUDE.md §10.2, ADR-035) ---
    ModoPrecio:
      type: string
      enum: [CON_IVA, SIN_IVA]
      description: >-
        Cómo se interpreta un monto: CON_IVA (el monto incluye IVA) o SIN_IVA (el IVA se suma). Solo cambia la
        interpretación, no las tasas (ADR-015).
    NaturalezaCuenta:
      type: string
      enum: [DEUDORA, ACREEDORA]
      description: Naturaleza de la cuenta; deudora aumenta con el Debe (clases 1 y 4), acreedora con el Haber (2, 3 y 5).
    TipoOperacionContable:
      type: string
      enum: [CIERRE_INGRESOS_DIARIO]
      description: Tipo de operación externa contabilizable; en 1.0 solo el cierre de ingresos diarios (ADR-017).
    TipoOperacion:
      type: string
      enum:
        - VENTA
        - COMPRA_GASTO
        - COBRO_CLIENTE
        - PAGO_PROVEEDOR
        - APORTE_CAPITAL
        - PRESTAMO_RECIBIDO
        - PAGO_CUOTA
        - TRASLADO_FONDOS
        - COMPRA_ACTIVO_FIJO
        - DEPRECIACION_MENSUAL
        - CIERRE_INGRESOS_DIARIO
      description: >-
        Tipo de operación que contabiliza el motor único ContabilizarOperacion (ADR-041 §5.2): los diez tipos
        guiados más CIERRE_INGRESOS_DIARIO, que llega por el webhook de n8n y usa el mismo motor. Se usa en las
        reglas de contabilización, en el registro y en la consulta de operaciones guiadas.
    CategoriaRegla:
      type: string
      enum: [INGRESO, COBRO, PAGO, GASTO, CONTRAPARTIDA, ACTIVO, DEPRECIACION]
      description: >-
        Categoría de la regla de contabilización (ADR-020, ampliada por ADR-041 §5.3-§5.5): INGRESO un concepto de
        venta, COBRO una forma de cobro, PAGO una forma de pago, GASTO un destino de compra o gasto, CONTRAPARTIDA
        la cuenta de la contraparte de un cobro, pago, aporte o préstamo, ACTIVO una categoría de activo fijo y
        DEPRECIACION su cuenta de depreciación acumulada o de gasto.
    ResumenCuenta:
      type: object
      description: Referencia corta a una cuenta contable, para mostrarla dentro de otros recursos.
      required: [id, codigo, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          description: Código de la cuenta.
        nombre:
          type: string
          description: Nombre de la cuenta.
    CuentaContable:
      type: object
      description: Cuenta del catálogo de la empresa; también viaja su versión como ETag.
      required:
        [id, codigo, nombre, clase, nivel, cuentaPadreId, naturaleza, aceptaMovimientos, activa, version, sistema]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          description: Código de la cuenta; su primer dígito es la clase.
        nombre:
          type: string
          description: Nombre de la cuenta.
        clase:
          type: integer
          minimum: 1
          maximum: 5
          description: Clase de la cuenta (primer dígito del código) 1 Activo, 2 Pasivo, 3 Capital, 4 Costos y Gastos, 5 Ingresos.
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel por longitud del código, 1 clase, 2 grupo, 3 cuenta, 4 subcuenta, 5 detalle.
        cuentaPadreId:
          type: [string, 'null']
          format: uuid
          description: Cuenta padre (su código es prefijo del de esta cuenta); nulo en las clases.
        naturaleza:
          $ref: '#/components/schemas/NaturalezaCuenta'
          description: >-
            Naturaleza de la cuenta; de solo lectura, derivada de la cuenta padre o de la clase en el nivel 1
            (ADR-042). Ya no se envía al crear ni al editar una cuenta.
        aceptaMovimientos:
          type: boolean
          description: true solo en las cuentas de detalle, sin hijas; únicas que aceptan movimientos.
        activa:
          type: boolean
          description: Si la cuenta está activa; una cuenta inactiva no acepta movimientos.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
        sistema:
          type: boolean
          readOnly: true
          description: >-
            true si la cuenta viene del catálogo base: su código, nombre, naturaleza y estado no se editan
            (422 CON-021, ADR-042). El usuario agrega subcuentas propias bajo las cuentas base que no son de
            detalle, y esas sí las edita.
    NuevaCuentaContable:
      type: object
      description: >-
        Datos para crear una cuenta. La cuenta padre no se envía porque se deduce del código (ADR-035). El patrón
        del código no exige la clase para que la regla de negocio responda CON-010 y CON-015. La naturaleza no se
        envía: siempre se deriva de la cuenta padre, o de la clase en el nivel 1 (ADR-042).
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          pattern: '^[0-9]{1,8}$'
          description: Código de 1 a 8 dígitos; su primer dígito debe ser una clase de 1 a 5 (CON-010).
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          description: Nombre de la cuenta.
    ActualizacionCuentaContable:
      type: object
      description: >-
        Campos editables de una cuenta; solo se envían los que cambian y debe venir al menos uno. La naturaleza no
        se envía: es de solo lectura, derivada de la cuenta padre o de la clase (ADR-042).
      minProperties: 1
      properties:
        codigo:
          type: string
          pattern: '^[0-9]{1,8}$'
          description: Nuevo código; no puede cambiarse si la cuenta tiene movimientos (CON-011).
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          description: Nuevo nombre de la cuenta.
        activa:
          type: boolean
          description: false desactiva la cuenta (CON-012 si tiene saldo, CON-016 si está en uso); true la reactiva.

    # --- Configuración contable (CLAUDE.md §11.3) ---
    ConfiguracionContable:
      type: object
      description: Configuración contable de la empresa; también viaja su versión como ETag.
      required: [modoPrecioDefecto, cuentaIvaDebito, cuentaIvaCredito, version]
      properties:
        modoPrecioDefecto:
          $ref: '#/components/schemas/ModoPrecio'
        cuentaIvaDebito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA débito fiscal (pasivo), usada en las ventas.
        cuentaIvaCredito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA crédito fiscal (activo), usada en las compras.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
    ActualizacionConfiguracionContable:
      type: object
      description: >-
        Configuración que reemplaza a la actual (PUT completo). Las cuentas de IVA débito y crédito fiscal son
        fijas, desde la plantilla (21020101 y 11040101) y no se envían aquí; ConfiguracionContable las sigue
        devolviendo, de solo lectura (ADR-042).
      required: [modoPrecioDefecto]
      properties:
        modoPrecioDefecto:
          $ref: '#/components/schemas/ModoPrecio'

    # --- Reglas de contabilización (ADR-020, ADR-035, ampliadas por ADR-041 y ADR-042) ---
    ReglaContabilizacion:
      type: object
      description: >-
        Regla que asigna una cuenta a un código de una operación (ADR-020, ADR-041); su versión es el valor de
        If-Match.
      required: [id, tipoOperacion, categoria, codigo, cuenta, activa, version, prefijoPermitido]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipoOperacion:
          $ref: '#/components/schemas/TipoOperacion'
        categoria:
          $ref: '#/components/schemas/CategoriaRegla'
        codigo:
          type: string
          description: Código del concepto, forma de cobro o pago, destino o categoría, p. ej. VENTAS_GRAVADAS o EFECTIVO.
        cuenta:
          oneOf:
            - $ref: '#/components/schemas/ResumenCuenta'
            - type: 'null'
          description: Cuenta de detalle que usa la regla; nula solo si la regla está inactiva (ADR-035).
        activa:
          type: boolean
          description: Si la regla está activa; una regla activa siempre tiene cuenta.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; se envía entre comillas como If-Match (CLAUDE.md §8.3).
        prefijoPermitido:
          type: [string, 'null']
          readOnly: true
          description: >-
            Prefijo de código que debe tener la cuenta de esta regla (p. ej. "1101"); de solo lectura. Asignarle una
            cuenta fuera de este grupo responde 422 CON-022 (ADR-042).
    ActualizacionReglaContabilizacion:
      type: object
      description: Cuenta y estado de una regla (PUT completo); ambos campos son obligatorios.
      required: [cuentaId, activa]
      properties:
        cuentaId:
          type: [string, 'null']
          format: uuid
          description: Cuenta de detalle activa de la regla (CON-006); nula solo si activa es false.
        activa:
          type: boolean
          description: true activa la regla y exige cuentaId (PLT-002 si es nulo); false la desactiva.

    # --- Contabilidad: Libro Diario, vista previa y reversión (CLAUDE.md §10.1, ADR-036) ---
    MontoEntrada:
      type: string
      pattern: '^-?\d{1,17}(\.\d+)?$'
      examples: ['113.00']
      description: >-
        Monto de entrada de una línea de asiento como cadena decimal, con signo opcional y cualquier cantidad de
        decimales. Solo se usa al enviar líneas: es deliberadamente más permisivo que Monto para que la validación de
        forma no rechace un negativo ni más de 2 decimales, y sea la regla de negocio la que responda CON-003 (ADR-036).
        Nunca número JSON (ADR-013).
    EstadoAsiento:
      type: string
      enum: [CONTABILIZADO, REVERTIDO]
      description: Estado del asiento; REVERTIDO es el único cambio permitido tras guardarlo (ADR-019).
    OrigenAsiento:
      type: string
      enum: [MANUAL, N8N, REVERSION]
      description: Cómo nació el asiento — registro manual, operación recibida por n8n o reversión de otro asiento.
    OrigenLinea:
      type: string
      enum: [USUARIO, IVA_CALCULADO, OPERACION]
      description: >-
        Origen de la línea — capturada por el usuario, IVA calculado por el backend al expandir una línea con "lleva
        IVA" (CLAUDE.md §11.2) o generada por una operación externa.
    NuevaLineaAsiento:
      type: object
      description: Línea de entrada de un asiento; cada línea lleva solo Debe o solo Haber (CON-002).
      required: [cuentaId, debe, haber]
      properties:
        cuentaId:
          $ref: '#/components/schemas/Uuid'
          description: Cuenta de detalle, activa y de la empresa (CON-006).
        descripcion:
          type: string
          maxLength: 300
          description: Descripción opcional de la línea.
        debe:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto al Debe; "0" o "0.00" si la línea va al Haber.
        haber:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto al Haber; "0" o "0.00" si la línea va al Debe.
        llevaIva:
          type: boolean
          default: false
          description: >-
            Si la línea lleva IVA; el backend la expande en la línea base y una línea de IVA del mismo lado (débito fiscal
            al Haber, crédito fiscal al Debe). No se permite sobre cuentas de IVA (CON-013).
    NuevoAsiento:
      type: object
      description: >-
        Datos de un asiento manual. No lleva mínimo de líneas en la forma para que el negocio responda CON-001, ni
        totales: los calcula el backend.
      required: [fecha, concepto, lineas]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable en hora de El Salvador; obligatoria y no futura (CON-007).
        concepto:
          type: string
          minLength: 1
          maxLength: 500
          description: Concepto o glosa del asiento.
        modoPrecio:
          $ref: '#/components/schemas/ModoPrecio'
          description: Modo de precio para separar el IVA; si falta se usa el de la configuración contable (ADR-015).
        lineas:
          type: array
          maxItems: 200
          description: Líneas del asiento, máximo 200; el mínimo de dos (CON-001) lo valida el negocio.
          items:
            $ref: '#/components/schemas/NuevaLineaAsiento'
    LineaAsiento:
      type: object
      description: Línea de un asiento guardado, ya expandida.
      required: [id, numeroLinea, cuenta, descripcion, debe, haber, origenLinea, lineaBaseId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        numeroLinea:
          type: integer
          minimum: 1
          description: Posición de la línea dentro del asiento, desde 1.
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        descripcion:
          type: [string, 'null']
          description: Descripción de la línea; nula si no tiene.
        debe:
          $ref: '#/components/schemas/Monto'
        haber:
          $ref: '#/components/schemas/Monto'
        origenLinea:
          $ref: '#/components/schemas/OrigenLinea'
        lineaBaseId:
          type: [string, 'null']
          format: uuid
          description: En una línea de IVA calculado, la línea que la originó; nulo en las demás.
    Asiento:
      type: object
      description: Asiento guardado con sus líneas; inmutable salvo su paso a REVERTIDO (ADR-019).
      required: [id, anio, numero, fecha, concepto, estado, origenTipo, origenId, modoPrecio, asientoRevertidoId, asientoReversionId, totalDebe, totalHaber, creadoEn, lineas]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        anio:
          type: integer
          description: Año de la fecha contable; junto con numero forma el correlativo.
        numero:
          type: integer
          format: int64
          description: Número correlativo del asiento dentro de la empresa y el año.
        fecha:
          $ref: '#/components/schemas/Fecha'
        concepto:
          type: string
          description: Concepto o glosa del asiento.
        estado:
          $ref: '#/components/schemas/EstadoAsiento'
        origenTipo:
          $ref: '#/components/schemas/OrigenAsiento'
        origenId:
          type: [string, 'null']
          format: uuid
          description: Operación externa que originó el asiento; nulo si no viene de n8n.
        modoPrecio:
          oneOf:
            - $ref: '#/components/schemas/ModoPrecio'
            - type: 'null'
          description: Modo de precio usado para separar el IVA; nulo si ninguna línea llevó IVA.
        asientoRevertidoId:
          type: [string, 'null']
          format: uuid
          description: En una reversión, el asiento que revierte; nulo en las demás.
        asientoReversionId:
          type: [string, 'null']
          format: uuid
          description: En un asiento revertido, su reversión; nulo si no está revertido.
        totalDebe:
          $ref: '#/components/schemas/Monto'
        totalHaber:
          $ref: '#/components/schemas/Monto'
        creadoEn:
          $ref: '#/components/schemas/FechaHora'
        lineas:
          type: array
          description: Líneas del asiento ordenadas por numeroLinea.
          items:
            $ref: '#/components/schemas/LineaAsiento'
    ResumenAsiento:
      type: object
      description: Cabecera de un asiento para el listado del Libro Diario, sin líneas.
      required: [id, anio, numero, fecha, concepto, estado, origenTipo, totalDebe, totalHaber]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        anio:
          type: integer
          description: Año de la fecha contable.
        numero:
          type: integer
          format: int64
          description: Número correlativo dentro de la empresa y el año.
        fecha:
          $ref: '#/components/schemas/Fecha'
        concepto:
          type: string
          description: Concepto o glosa del asiento.
        estado:
          $ref: '#/components/schemas/EstadoAsiento'
        origenTipo:
          $ref: '#/components/schemas/OrigenAsiento'
        totalDebe:
          $ref: '#/components/schemas/Monto'
        totalHaber:
          $ref: '#/components/schemas/Monto'
    PaginaAsientos:
      description: Página del Libro Diario.
      allOf:
        - $ref: '#/components/schemas/PaginaCursor'
        - type: object
          required: [elementos]
          properties:
            elementos:
              type: array
              description: Asientos de la página.
              items:
                $ref: '#/components/schemas/ResumenAsiento'
    LineaVistaPrevia:
      type: object
      description: Línea de la vista previa, ya expandida por el backend pero aún sin guardar.
      required: [numeroLinea, cuenta, descripcion, debe, haber, origenLinea, numeroLineaOrigen]
      properties:
        numeroLinea:
          type: integer
          minimum: 1
          description: Posición de la línea en el asiento expandido, desde 1.
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        descripcion:
          type: [string, 'null']
          description: Descripción de la línea; nula si no tiene.
        debe:
          $ref: '#/components/schemas/Monto'
        haber:
          $ref: '#/components/schemas/Monto'
        origenLinea:
          $ref: '#/components/schemas/OrigenLinea'
        numeroLineaOrigen:
          type: [integer, 'null']
          description: En una línea de IVA calculado, el número de la línea que la originó; nulo en las demás.
    VistaPreviaAsiento:
      type: object
      description: >-
        Resultado de expandir y sumar un asiento sin guardarlo. Se devuelve aunque no cuadre (ADR-036), para validar
        la partida doble sobre las líneas expandidas por el backend.
      required: [modoPrecio, tasaIva, lineas, totalDebe, totalHaber, diferencia, cuadra]
      properties:
        modoPrecio:
          oneOf:
            - $ref: '#/components/schemas/ModoPrecio'
            - type: 'null'
          description: Modo de precio aplicado; nulo si ninguna línea lleva IVA.
        tasaIva:
          type: [string, 'null']
          pattern: '^\d{1,3}(\.\d{1,4})?$'
          examples: ['0.1300']
          description: Tasa de IVA vigente a la fecha del asiento como cadena decimal; nula si ninguna línea lleva IVA.
        lineas:
          type: array
          description: Líneas expandidas, con las de IVA calculado incluidas.
          items:
            $ref: '#/components/schemas/LineaVistaPrevia'
        totalDebe:
          $ref: '#/components/schemas/Monto'
        totalHaber:
          $ref: '#/components/schemas/Monto'
        diferencia:
          $ref: '#/components/schemas/MontoConSigno'
          description: Σ Debe − Σ Haber de las líneas expandidas.
        cuadra:
          type: boolean
          description: true si hay al menos dos líneas, los totales son mayores que cero y el Debe es igual al Haber.
    NuevaReversion:
      type: object
      description: Datos opcionales de una reversión.
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: >-
            Fecha contable de la reversión; por defecto hoy en hora de El Salvador. No puede ser futura (CON-007) ni
            anterior a la del asiento original (CON-018).

    # --- Operaciones guiadas y tablero (ADR-041, ADR-042, spec F4.5 §5): el motor único ContabilizarOperacion ---
    FormaCobro:
      type: string
      enum: [EFECTIVO, BANCO, TARJETA, CREDITO]
      description: >-
        Forma en que el cliente pagó una venta (spec F4.5 §5.3); resuelve la cuenta de contrapartida por la regla
        COBRO del tipo VENTA.
    FormaPago:
      type: string
      enum: [EFECTIVO, BANCO, CREDITO]
      description: >-
        Forma en que la empresa pagó una compra, un gasto, un activo fijo o una cuota (spec F4.5 §5.3); resuelve la
        cuenta por la regla PAGO.
    DestinoFondos:
      type: string
      enum: [EFECTIVO, BANCO]
      description: >-
        Cuenta de efectivo o de banco de origen o de destino de un movimiento de fondos (spec F4.5 §5.3); resuelve
        la cuenta por la regla COBRO o PAGO según la operación.
    DocumentoCompra:
      type: string
      enum: [CREDITO_FISCAL, FACTURA]
      description: >-
        Documento recibido en una compra, un gasto o un activo fijo: CREDITO_FISCAL da derecho a crédito fiscal de
        IVA (se separa la base y el IVA crédito); FACTURA es de consumidor final, no da derecho a crédito fiscal y
        el total se registra al costo o al gasto (CLAUDE.md §11.2).
    PlazoPrestamo:
      type: string
      enum: [CORTO, LARGO]
      description: >-
        Plazo del préstamo recibido o de la cuota que se paga — CORTO (pasivo circulante) o LARGO (pasivo no
        circulante); resuelve la cuenta de la contraparte (spec F4.5 §5.3).
    DestinoGasto:
      type: string
      enum:
        - MERCADERIA
        - ALQUILER
        - SERVICIOS_BASICOS
        - PAPELERIA
        - SUELDOS_ADMINISTRACION
        - SUELDOS_VENTAS
        - HONORARIOS
        - PUBLICIDAD
        - COMISIONES_BANCARIAS
        - OTRO_GASTO
      description: >-
        Destino de una compra o gasto (spec F4.5 §5.4); resuelve la cuenta por la regla GASTO del tipo
        COMPRA_GASTO. OTRO_GASTO no tiene cuenta por defecto y queda inactiva hasta configurarla (422 CON-020).
    CategoriaActivo:
      type: string
      enum: [MOBILIARIO_EQUIPO, EQUIPO_COMPUTO, VEHICULO, EDIFICIO, TERRENO]
      description: >-
        Categoría del activo fijo (spec F4.5 §5.5); resuelve la cuenta de activo por la regla ACTIVO y la de
        depreciación acumulada por la regla DEPRECIACION. TERRENO no se deprecia.
    OrigenCobro:
      type: string
      enum: [CLIENTES, TARJETAS]
      description: >-
        Origen del cobro a un cliente (spec F4.5 §5.3): CLIENTES es la cartera de clientes (cuenta 11020101);
        TARJETAS es la liquidación de un emisor de tarjetas (cuenta 11020102), con comisión y anticipo de IVA
        opcionales tal como vienen en la liquidación — Pilot no aplica tasas.
    EstadoActivoFijo:
      type: string
      enum: [EN_USO, REVERTIDO]
      description: >-
        Estado del activo fijo; pasa a REVERTIDO cuando se revierte el asiento de su compra (ADR-041 §5.5). No hay
        baja ni venta de activos en 1.0.
    EstadoOperacion:
      type: string
      enum: [CONTABILIZADA, REVERTIDA]
      description: >-
        Estado de una operación guiada; distinto de EstadoOperacionExterna, que es de la operación externa de n8n.
        Pasa a REVERTIDA cuando se revierte el asiento que generó (ADR-041 §5.2, ADR-036).
    ResumenOperacionGuiada:
      type: object
      description: Montos normalizados de una operación guiada, ya contabilizada o solo previsualizada (ADR-041 §5.2).
      required: [modoPrecio, base, iva, exento, noSujeto, total]
      properties:
        modoPrecio:
          oneOf:
            - $ref: '#/components/schemas/ModoPrecio'
            - type: 'null'
          description: Modo de precio con el que se separó el IVA; nulo si la operación no tiene líneas con IVA.
        base:
          $ref: '#/components/schemas/Monto'
          description: Base gravada de la operación; "0.00" si no aplica.
        iva:
          $ref: '#/components/schemas/Monto'
          description: IVA calculado sobre la base gravada; "0.00" si no aplica.
        exento:
          $ref: '#/components/schemas/Monto'
          description: Monto exento de la operación; "0.00" si no aplica.
        noSujeto:
          $ref: '#/components/schemas/Monto'
          description: Monto no sujeto de la operación; "0.00" si no aplica.
        total:
          $ref: '#/components/schemas/Monto'
          description: Monto total de la operación.
    # --- Solicitudes de cada tipo de operación guiada (spec F4.5 §5.3-§5.5) ---
    VentaSolicitud:
      type: object
      description: >-
        Datos de una venta (ADR-041 §5.3). Genera Debe en la forma de cobro y Haber en ventas gravadas, exentas y
        no sujetas más el IVA débito fiscal; al menos uno de gravado, exento o noSujeto debe ser mayor que cero.
      required: [fecha, descripcion, gravado, exento, noSujeto, formaCobro]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable de la venta; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción de la venta (p. ej. "Mostrador, cliente Juan"); forma parte del concepto del asiento.
        gravado:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto de ventas gravadas, interpretado según modoPrecio; "0" si esta venta no tiene parte gravada.
        exento:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto de ventas exentas; "0" si esta venta no tiene parte exenta.
        noSujeto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto de ventas no sujetas; "0" si esta venta no tiene parte no sujeta.
        modoPrecio:
          $ref: '#/components/schemas/ModoPrecio'
          description: Modo de precio para separar el IVA de gravado; si falta se usa el de la configuración contable.
        formaCobro:
          $ref: '#/components/schemas/FormaCobro'
    CompraGastoSolicitud:
      type: object
      description: >-
        Datos de una compra o un gasto (ADR-041 §5.3, §5.4). Con documento CREDITO_FISCAL separa la base y el IVA
        crédito fiscal; con FACTURA el total va al destino sin separar IVA (CLAUDE.md §11.2).
      required: [fecha, descripcion, destino, documento, monto, formaPago]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable de la compra o el gasto; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción de la compra o el gasto; forma parte del concepto del asiento.
        destino:
          $ref: '#/components/schemas/DestinoGasto'
        documento:
          $ref: '#/components/schemas/DocumentoCompra'
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto del documento, interpretado según modoPrecio si es CREDITO_FISCAL, o total si es FACTURA.
        modoPrecio:
          $ref: '#/components/schemas/ModoPrecio'
          description: Modo de precio para separar el IVA; solo aplica con documento CREDITO_FISCAL.
        formaPago:
          $ref: '#/components/schemas/FormaPago'
    CobroClienteSolicitud:
      type: object
      description: >-
        Datos de un cobro a un cliente (ADR-041 §5.3). Con origen CLIENTES acredita la cartera de clientes; con
        TARJETAS acredita la cuenta de tarjetas por el monto bruto y registra la comisión y el anticipo de IVA de
        la liquidación tal como los ingresa el usuario — Pilot no aplica tasas.
      required: [fecha, descripcion, origen, monto, destino]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable del cobro; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del cobro; forma parte del concepto del asiento.
        origen:
          $ref: '#/components/schemas/OrigenCobro'
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto bruto cobrado, antes de comisión y anticipo de IVA.
        destino:
          $ref: '#/components/schemas/DestinoFondos'
          description: Cuenta de efectivo o banco donde se recibe el neto del cobro.
        comision:
          $ref: '#/components/schemas/MontoEntrada'
          description: Comisión de la liquidación de tarjetas, tal como viene en ella; solo aplica con origen TARJETAS.
        anticipoIva:
          $ref: '#/components/schemas/MontoEntrada'
          description: Anticipo de IVA de la liquidación de tarjetas, tal como viene en ella; solo aplica con origen TARJETAS.
    PagoProveedorSolicitud:
      type: object
      description: Datos de un pago a proveedor (ADR-041 §5.3); debita la cuenta de proveedores.
      required: [fecha, descripcion, monto, origen]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable del pago; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del pago; forma parte del concepto del asiento.
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto pagado al proveedor.
        origen:
          $ref: '#/components/schemas/DestinoFondos'
          description: Cuenta de efectivo o banco de donde sale el pago.
    AporteSolicitud:
      type: object
      description: Datos de un aporte de capital (ADR-041 §5.3); acredita la cuenta de capital.
      required: [fecha, descripcion, monto, destino]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable del aporte; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del aporte; forma parte del concepto del asiento.
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto aportado.
        destino:
          $ref: '#/components/schemas/DestinoFondos'
          description: Cuenta de efectivo o banco donde se recibe el aporte.
    PrestamoSolicitud:
      type: object
      description: >-
        Datos de un préstamo recibido (ADR-041 §5.3); acredita el pasivo de corto o largo plazo según plazo.
      required: [fecha, descripcion, monto, plazo, destino]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable del préstamo; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del préstamo; forma parte del concepto del asiento.
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto recibido del préstamo.
        plazo:
          $ref: '#/components/schemas/PlazoPrestamo'
        destino:
          $ref: '#/components/schemas/DestinoFondos'
          description: Cuenta de efectivo o banco donde se recibe el préstamo.
    CuotaPrestamoSolicitud:
      type: object
      description: >-
        Datos del pago de una cuota de préstamo (ADR-041 §5.3); debita el capital contra el pasivo del plazo,
        los intereses y, si aplica, la comisión, contra la cuenta de origen.
      required: [fecha, descripcion, plazo, capital, intereses, origen]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable de la cuota; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción de la cuota; forma parte del concepto del asiento.
        plazo:
          $ref: '#/components/schemas/PlazoPrestamo'
          description: Plazo del préstamo al que pertenece la cuota, para debitar el pasivo correspondiente.
        capital:
          $ref: '#/components/schemas/MontoEntrada'
          description: Parte de la cuota que abona al capital del préstamo.
        intereses:
          $ref: '#/components/schemas/MontoEntrada'
          description: Parte de la cuota que corresponde a intereses.
        comision:
          $ref: '#/components/schemas/MontoEntrada'
          description: Comisión de la cuota, si la hay; "0" si no aplica.
        origen:
          $ref: '#/components/schemas/DestinoFondos'
          description: Cuenta de efectivo o banco de donde sale el pago de la cuota.
    TrasladoSolicitud:
      type: object
      description: >-
        Datos de un traslado de fondos entre dos cuentas de efectivo o bancos (ADR-041 §5.3). Ambas cuentas deben
        ser de detalle, activas, del grupo 1101 (422 CON-022) y distintas entre sí.
      required: [fecha, descripcion, monto, cuentaOrigenId, cuentaDestinoId]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha contable del traslado; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del traslado; forma parte del concepto del asiento.
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto trasladado.
        cuentaOrigenId:
          $ref: '#/components/schemas/Uuid'
          description: Cuenta de detalle del grupo 1101 de donde sale el traslado (CON-006, CON-022).
        cuentaDestinoId:
          $ref: '#/components/schemas/Uuid'
          description: Cuenta de detalle del grupo 1101 a donde llega el traslado; distinta de cuentaOrigenId (CON-006, CON-022).
    ActivoFijoSolicitud:
      type: object
      description: >-
        Datos de la compra de un activo fijo (ADR-041 §5.5); da de alta el activo y registra su costo. Con
        documento CREDITO_FISCAL el costo es la base y se separa el IVA crédito; con FACTURA el costo es el total.
      required: [fecha, descripcion, categoria, documento, monto, formaPago]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
          description: Fecha de adquisición del activo; obligatoria y no futura (CON-007).
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
          description: Descripción del activo (p. ej. "Laptop de administración"); forma parte del concepto del asiento.
        categoria:
          $ref: '#/components/schemas/CategoriaActivo'
        documento:
          $ref: '#/components/schemas/DocumentoCompra'
        monto:
          $ref: '#/components/schemas/MontoEntrada'
          description: Monto del documento, interpretado según modoPrecio si es CREDITO_FISCAL, o total si es FACTURA.
        modoPrecio:
          $ref: '#/components/schemas/ModoPrecio'
          description: Modo de precio para separar el IVA; solo aplica con documento CREDITO_FISCAL.
        formaPago:
          $ref: '#/components/schemas/FormaPago'
    DepreciacionSolicitud:
      type: object
      description: >-
        Mes a depreciar (ADR-041 §5.5); sin fecha ni descripción, porque genera un asiento por cada categoría con
        activos vigentes. Responde 422 CON-023 si alguna vida útil de las categorías con activos no está
        confirmada por el contador.
      required: [anio, mes]
      properties:
        anio:
          type: integer
          minimum: 2000
          maximum: 9999
          description: Año a depreciar; no puede ser posterior al mes y año actuales en hora de El Salvador.
        mes:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes a depreciar (1 a 12); una sola depreciación por activo y mes (índice único).
    # --- Respuestas de las operaciones guiadas ---
    OperacionRegistrada:
      type: object
      description: Resultado de registrar una operación guiada (ADR-041 §5.2).
      required: [operacionId, estado, asiento, resumen]
      properties:
        operacionId:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoOperacion'
        asiento:
          $ref: '#/components/schemas/ReferenciaAsiento'
        resumen:
          $ref: '#/components/schemas/ResumenOperacionGuiada'
    VistaPreviaOperacion:
      type: object
      description: >-
        Resultado de armar y sumar el asiento de una operación guiada sin guardarlo (patrón de ADR-036). Se
        devuelve aunque no cuadre; solo responde 422 si los datos no se pueden expandir.
      required: [lineas, totalDebe, totalHaber, diferencia, cuadra, resumen]
      properties:
        lineas:
          type: array
          description: Líneas del asiento que se generaría.
          items:
            $ref: '#/components/schemas/LineaVistaPrevia'
        totalDebe:
          $ref: '#/components/schemas/Monto'
        totalHaber:
          $ref: '#/components/schemas/Monto'
        diferencia:
          $ref: '#/components/schemas/MontoConSigno'
          description: Σ Debe − Σ Haber de las líneas.
        cuadra:
          type: boolean
          description: true si hay al menos dos líneas, los totales son mayores que cero y el Debe es igual al Haber.
        resumen:
          $ref: '#/components/schemas/ResumenOperacionGuiada'
    Operacion:
      type: object
      description: Operación guiada registrada, para el listado y el detalle (ADR-041 §5.6).
      required: [id, tipo, fecha, descripcion, total, estado, asiento, datos, resumen, creadoEn, creadoPor]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoOperacion'
        fecha:
          $ref: '#/components/schemas/Fecha'
        descripcion:
          type: [string, 'null']
          description: Descripción capturada por el usuario; nula en una depreciación (DepreciacionSolicitud no la tiene).
        total:
          $ref: '#/components/schemas/Monto'
        estado:
          $ref: '#/components/schemas/EstadoOperacion'
        asiento:
          $ref: '#/components/schemas/ReferenciaAsiento'
        datos:
          type: object
          additionalProperties: true
          readOnly: true
          description: >-
            Entrada de negocio ya validada con la que se generó la operación (p. ej. los campos de
            VentaSolicitud), de solo lectura. Objeto libre y sin properties en este contrato para que el generador
            lo traduzca a Map<String, Object> en vez de una clase de modelo (mismo patrón de OperacionN8n,
            ADR-039 §3); sus campos exactos dependen de tipo.
        resumen:
          $ref: '#/components/schemas/ResumenOperacionGuiada'
        creadoEn:
          $ref: '#/components/schemas/FechaHora'
        creadoPor:
          type: string
          description: Identificador de quien registró la operación (app.usuario_id).
    PaginaOperaciones:
      description: Página de operaciones guiadas, paginada por cursor.
      allOf:
        - $ref: '#/components/schemas/PaginaCursor'
        - type: object
          required: [elementos]
          properties:
            elementos:
              type: array
              description: Operaciones de la página.
              items:
                $ref: '#/components/schemas/Operacion'
    ActivoFijo:
      type: object
      description: Activo fijo dado de alta por una operación COMPRA_ACTIVO_FIJO (ADR-041 §5.5).
      required:
        [id, descripcion, categoria, fechaAdquisicion, costo, valorResidual, vidaUtilMeses, depreciacionAcumulada, valorEnLibros, estado]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        descripcion:
          type: string
          description: Descripción del activo.
        categoria:
          $ref: '#/components/schemas/CategoriaActivo'
        fechaAdquisicion:
          $ref: '#/components/schemas/Fecha'
        costo:
          $ref: '#/components/schemas/Monto'
          description: Costo de adquisición del activo (base con documento CREDITO_FISCAL, total con FACTURA).
        valorResidual:
          $ref: '#/components/schemas/Monto'
          description: Valor residual estimado al final de su vida útil.
        vidaUtilMeses:
          type: integer
          minimum: 1
          description: Vida útil en meses usada para calcular la cuota de depreciación en línea recta.
        depreciacionAcumulada:
          $ref: '#/components/schemas/Monto'
          description: Suma de las cuotas de depreciación registradas hasta la fecha.
        valorEnLibros:
          $ref: '#/components/schemas/Monto'
          description: costo − depreciacionAcumulada.
        estado:
          $ref: '#/components/schemas/EstadoActivoFijo'
    # --- Tablero de inicio (ADR-041 §5.7) ---
    TableroSaldoCuenta:
      type: object
      description: Saldo de una cuenta de efectivo o banco (grupo 1101) mostrado en el tablero.
      required: [cuenta, saldo]
      properties:
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        saldo:
          $ref: '#/components/schemas/Saldo'
    TableroPeriodo:
      type: object
      description: Resultado de un mes, para el mes actual y el anterior del tablero.
      required: [ingresos, costosGastos, utilidad]
      properties:
        ingresos:
          $ref: '#/components/schemas/Monto'
        costosGastos:
          $ref: '#/components/schemas/Monto'
        utilidad:
          $ref: '#/components/schemas/MontoConSigno'
          description: ingresos − costosGastos; puede ser negativa.
    TableroSerieItem:
      type: object
      description: Punto de la serie de 6 meses de ingresos y gastos del tablero.
      required: [anio, mes, ingresos, gastos]
      properties:
        anio:
          type: integer
          description: Año del punto de la serie.
        mes:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes del punto de la serie (1 a 12).
        ingresos:
          $ref: '#/components/schemas/Monto'
        gastos:
          $ref: '#/components/schemas/Monto'
    PendienteTipo:
      type: string
      enum: [REGLA_SIN_CUENTA, DEPRECIACION_PENDIENTE, VIDA_UTIL_SIN_CONFIRMAR, SALDO_CONTRARIO, DIAGNOSTICO_INCONSISTENTE]
      description: >-
        Tipo de pendiente accionable del tablero: una regla activa sin cuenta, la depreciación del mes sin
        registrar, una vida útil sin confirmar por el contador, una cuenta con saldo contrario a su naturaleza, o
        el diagnóstico de mayorización con una diferencia distinta de cero.
    PendienteSeveridad:
      type: string
      enum: [INFO, ADVERTENCIA, ERROR]
      description: Severidad del pendiente, para ordenarlo y darle color en el tablero.
    TableroPendiente:
      type: object
      description: Pendiente accionable mostrado en el tablero de inicio.
      required: [tipo, severidad, detalle, cantidad]
      properties:
        tipo:
          $ref: '#/components/schemas/PendienteTipo'
        severidad:
          $ref: '#/components/schemas/PendienteSeveridad'
        detalle:
          type: string
          description: Explicación del pendiente en español, sin citar documentos internos.
        cantidad:
          type: integer
          minimum: 1
          description: Cuántos elementos agrupa el pendiente (p. ej. cuántas reglas sin cuenta).
    Tablero:
      type: object
      description: Indicadores y pendientes del tablero de inicio (ADR-041 §5.7).
      required: [efectivo, porCobrar, porPagar, mes, mesAnterior, ivaEstimado, serie, pendientes]
      properties:
        efectivo:
          type: array
          description: Saldo de cada cuenta de detalle del grupo 1101 (caja y bancos).
          items:
            $ref: '#/components/schemas/TableroSaldoCuenta'
        porCobrar:
          $ref: '#/components/schemas/Monto'
          description: Saldo de la cuenta 1102 (cuentas por cobrar).
        porPagar:
          $ref: '#/components/schemas/Monto'
          description: Saldo de la cuenta 2101 (cuentas por pagar).
        mes:
          $ref: '#/components/schemas/TableroPeriodo'
          description: Resultado del mes consultado.
        mesAnterior:
          $ref: '#/components/schemas/TableroPeriodo'
          description: Resultado del mes inmediato anterior, para comparar.
        ivaEstimado:
          $ref: '#/components/schemas/MontoConSigno'
          description: IVA débito menos IVA crédito del mes; positivo es lo estimado a pagar.
        serie:
          type: array
          minItems: 6
          maxItems: 6
          description: Serie de los últimos 6 meses (incluido el consultado) de ingresos y gastos, en orden cronológico.
          items:
            $ref: '#/components/schemas/TableroSerieItem'
        pendientes:
          type: array
          description: Pendientes accionables de contabilidad, sin datos personales.
          items:
            $ref: '#/components/schemas/TableroPendiente'

    # --- Reportes y exportaciones (CLAUDE.md §10.4, §10.5, §11, ADR-038) ---
    LadoSaldo:
      type: string
      enum: [DEUDOR, ACREEDOR, CERO]
      description: Lado del saldo de una cuenta — DEUDOR, ACREEDOR o CERO cuando Debe y Haber son iguales (CLAUDE.md §10.3).
    Saldo:
      type: object
      description: Saldo de una cuenta presentado como valor absoluto y lado (CLAUDE.md §10.3).
      required: [monto, lado, contrarioNaturaleza]
      properties:
        monto:
          $ref: '#/components/schemas/Monto'
          description: Valor absoluto del saldo (Debe − Haber en valor absoluto).
        lado:
          $ref: '#/components/schemas/LadoSaldo'
        contrarioNaturaleza:
          type: boolean
          description: >-
            true si el saldo queda del lado contrario a la naturaleza de la cuenta (alerta de CLAUDE.md §10.3);
            false en un saldo CERO.
    FormatoExportacion:
      type: string
      enum: [pdf, xlsx, csv]
      description: Formato del archivo exportado (ADR-038).

    # --- Libro Mayor (ADR-038 §5) ---
    MovimientoMayor:
      type: object
      description: Movimiento del Libro Mayor con el saldo acumulado tras aplicarlo.
      required: [fecha, asientoId, anio, numero, concepto, descripcion, cuenta, debe, haber, saldo]
      properties:
        fecha:
          $ref: '#/components/schemas/Fecha'
        asientoId:
          $ref: '#/components/schemas/Uuid'
          description: Asiento al que pertenece la línea.
        anio:
          type: integer
          description: Año del asiento; junto con numero forma su correlativo.
        numero:
          type: integer
          format: int64
          description: Número correlativo del asiento.
        concepto:
          type: string
          description: Concepto o glosa del asiento.
        descripcion:
          type: [string, 'null']
          description: Descripción de la línea; nula si no tiene.
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
          description: >-
            Cuenta de detalle de la línea; en el Mayor de una cuenta padre, cada movimiento identifica su propia
            cuenta de detalle (ADR-038 §5).
        debe:
          $ref: '#/components/schemas/Monto'
        haber:
          $ref: '#/components/schemas/Monto'
        saldo:
          $ref: '#/components/schemas/Saldo'
          description: Saldo acumulado de la cuenta consultada inmediatamente después de esta línea.
    LibroMayor:
      type: object
      description: >-
        Libro Mayor / auxiliar de una cuenta (o de sus cuentas de detalle si es una cuenta padre) en un rango de
        fechas.
      required: [cuenta, naturaleza, desde, hasta, saldoInicial, movimientos, totalDebe, totalHaber, saldoFinal]
      properties:
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta consultada; puede ser una cuenta padre (ADR-038 §5).
        naturaleza:
          $ref: '#/components/schemas/NaturalezaCuenta'
        desde:
          $ref: '#/components/schemas/Fecha'
        hasta:
          $ref: '#/components/schemas/Fecha'
        saldoInicial:
          $ref: '#/components/schemas/Saldo'
          description: Saldo acumulado antes de desde.
        movimientos:
          type: array
          description: Movimientos en el rango, ordenados por fecha, con saldo acumulado línea a línea.
          items:
            $ref: '#/components/schemas/MovimientoMayor'
        totalDebe:
          $ref: '#/components/schemas/Monto'
          description: Suma del Debe de los movimientos del rango.
        totalHaber:
          $ref: '#/components/schemas/Monto'
          description: Suma del Haber de los movimientos del rango.
        saldoFinal:
          $ref: '#/components/schemas/Saldo'
          description: Saldo acumulado al final de hasta.

    # --- Balanza de Comprobación (ADR-038 §6) ---
    FilaBalanza:
      type: object
      description: Fila de la Balanza de Comprobación para una cuenta hasta el nivel pedido.
      required: [cuenta, nivel, esDetalle, saldoInicial, debe, haber, saldoFinal]
      properties:
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de la cuenta por longitud de código (CLAUDE.md §10.2).
        esDetalle:
          type: boolean
          description: true si es una cuenta de detalle; los totales de la balanza salen solo de estas filas (ADR-038 §6).
        saldoInicial:
          $ref: '#/components/schemas/Saldo'
          description: Saldo acumulado antes de desde.
        debe:
          $ref: '#/components/schemas/Monto'
          description: Suma del Debe en el rango.
        haber:
          $ref: '#/components/schemas/Monto'
          description: Suma del Haber en el rango.
        saldoFinal:
          $ref: '#/components/schemas/Saldo'
          description: Saldo acumulado al final de hasta.
    BalanzaComprobacion:
      type: object
      description: >-
        Balanza de Comprobación con una fila por cuenta hasta el nivel pedido. Los totales se calculan solo con las
        cuentas de detalle, para no contar dos veces los saldos de las cuentas padre (ADR-038 §6).
      required: [desde, hasta, nivel, filas, totalDebe, totalHaber, totalSaldosDeudores, totalSaldosAcreedores, cuadra]
      properties:
        desde:
          $ref: '#/components/schemas/Fecha'
        hasta:
          $ref: '#/components/schemas/Fecha'
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel del catálogo hasta el que se agrupan las filas.
        filas:
          type: array
          description: Filas de la balanza ordenadas por código.
          items:
            $ref: '#/components/schemas/FilaBalanza'
        totalDebe:
          $ref: '#/components/schemas/Monto'
          description: Σ Debe de las cuentas de detalle.
        totalHaber:
          $ref: '#/components/schemas/Monto'
          description: Σ Haber de las cuentas de detalle.
        totalSaldosDeudores:
          $ref: '#/components/schemas/Monto'
          description: Σ de los saldos finales del lado deudor de las cuentas de detalle.
        totalSaldosAcreedores:
          $ref: '#/components/schemas/Monto'
          description: Σ de los saldos finales del lado acreedor de las cuentas de detalle.
        cuadra:
          type: boolean
          description: true si Σ Debe = Σ Haber y Σ saldos deudores = Σ saldos acreedores (siempre se cumple, por la partida doble).

    # --- Estados financieros (CLAUDE.md §10.4, ADR-016, ADR-037, ADR-038 §7) ---
    FilaEstado:
      type: object
      description: Fila jerárquica de un estado financiero.
      required: [cuenta, nivel, monto]
      properties:
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de la cuenta por longitud de código (CLAUDE.md §10.2).
        monto:
          $ref: '#/components/schemas/MontoConSigno'
          description: Monto en positivo según la naturaleza de la clase de la cuenta; negativo si es contrario.
    RubroEstado:
      type: object
      description: Rubro de un estado financiero (una clase de cuenta) con sus filas y su total.
      required: [clase, nombre, filas, total]
      properties:
        clase:
          type: integer
          minimum: 1
          maximum: 5
          description: Clase de cuenta del rubro (CLAUDE.md §10.2).
        nombre:
          type: string
          description: Nombre del rubro, p. ej. "Activo" o "Ingresos".
        filas:
          type: array
          description: Filas del rubro hasta el nivel pedido, con incluirCeros aplicado.
          items:
            $ref: '#/components/schemas/FilaEstado'
        total:
          $ref: '#/components/schemas/MontoConSigno'
          description: Suma de las cuentas de detalle del rubro.
    EstadoSituacionFinanciera:
      type: object
      description: >-
        Estado de Situación Financiera de gestión a una fecha de corte, con la comprobación Activo = Pasivo +
        Patrimonio + resultados de ejercicios anteriores + utilidad del ejercicio (ADR-016, ADR-037).
      required:
        [fechaCorte, nivel, activo, pasivo, patrimonio, resultadosEjerciciosAnteriores, utilidadEjercicio,
         totalPasivoPatrimonio, comprobacion, leyenda]
      properties:
        fechaCorte:
          $ref: '#/components/schemas/Fecha'
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel del catálogo hasta el que se agrupan las filas.
        activo:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro de la clase 1.
        pasivo:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro de la clase 2.
        patrimonio:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro de la clase 3.
        resultadosEjerciciosAnteriores:
          $ref: '#/components/schemas/MontoConSigno'
          description: Utilidad (Ingresos − Costos y gastos) acumulada hasta el 31/12 del año anterior al corte.
        utilidadEjercicio:
          $ref: '#/components/schemas/MontoConSigno'
          description: Utilidad (Ingresos − Costos y gastos) del 1/1 del año del corte hasta fechaCorte.
        totalPasivoPatrimonio:
          $ref: '#/components/schemas/MontoConSigno'
          description: Pasivo + Patrimonio + resultadosEjerciciosAnteriores + utilidadEjercicio.
        comprobacion:
          type: object
          description: Verifica que Activo sea igual a totalPasivoPatrimonio (CLAUDE.md §10.4).
          required: [cuadra, diferencia]
          properties:
            cuadra:
              type: boolean
              description: true si Activo = totalPasivoPatrimonio.
            diferencia:
              $ref: '#/components/schemas/MontoConSigno'
              description: Activo − totalPasivoPatrimonio; distinto de cero solo ante un error de datos.
        leyenda:
          type: string
          description: >-
            "Estado de gestión generado por Pilot; no constituye un juego completo de estados financieros conforme
            a NIIF para PYMES" (ADR-037 §3).
    EstadoResultados:
      type: object
      description: Estado de Resultados de gestión en un rango de fechas, con el impuesto sobre la renta aparte (ADR-037).
      required: [desde, hasta, nivel, ingresos, costosGastos, utilidadAntesImpuesto, impuestoSobreRenta, utilidadEjercicio, leyenda]
      properties:
        desde:
          $ref: '#/components/schemas/Fecha'
        hasta:
          $ref: '#/components/schemas/Fecha'
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel del catálogo hasta el que se agrupan las filas.
        ingresos:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro de la clase 5.
        costosGastos:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro de la clase 4, sin el grupo 44 (impuesto sobre la renta).
        utilidadAntesImpuesto:
          $ref: '#/components/schemas/MontoConSigno'
          description: Ingresos − Costos y gastos.
        impuestoSobreRenta:
          $ref: '#/components/schemas/RubroEstado'
          description: Rubro del grupo 44 (impuesto sobre la renta), aparte de costosGastos (ADR-037).
        utilidadEjercicio:
          $ref: '#/components/schemas/MontoConSigno'
          description: Utilidad antes de impuesto − Impuesto sobre la renta.
        leyenda:
          type: string
          description: >-
            "Estado de gestión generado por Pilot; no constituye un juego completo de estados financieros conforme
            a NIIF para PYMES" (ADR-037 §3).

    # --- Resumen de IVA (CLAUDE.md §10.5, §11, ADR-038 §8) ---
    DesgloseIva:
      type: object
      description: Desglose de un IVA (débito o crédito fiscal) por el origen del asiento.
      required: [manual, n8n, reversion, total]
      properties:
        manual:
          $ref: '#/components/schemas/MontoConSigno'
          description: Movimiento de asientos de origen MANUAL.
        n8n:
          $ref: '#/components/schemas/MontoConSigno'
          description: Movimiento de asientos de origen N8N.
        reversion:
          $ref: '#/components/schemas/MontoConSigno'
          description: Movimiento de asientos de origen REVERSION.
        total:
          $ref: '#/components/schemas/MontoConSigno'
          description: Suma de manual, n8n y reversion.
    ResumenIva:
      type: object
      description: Resumen de IVA de un mes; punto de partida para la declaración, no la reemplaza (CLAUDE.md §10.5).
      required: [anio, mes, cuentaIvaDebito, cuentaIvaCredito, ivaDebito, ivaCredito, diferenciaEstimada, nota]
      properties:
        anio:
          type: integer
          description: Año del período consultado.
        mes:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes del período consultado.
        cuentaIvaDebito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA débito fiscal configurada (CLAUDE.md §11.3).
        cuentaIvaCredito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA crédito fiscal configurada (CLAUDE.md §11.3).
        ivaDebito:
          $ref: '#/components/schemas/DesgloseIva'
          description: Haber − Debe de la cuenta de IVA débito fiscal.
        ivaCredito:
          $ref: '#/components/schemas/DesgloseIva'
          description: Debe − Haber de la cuenta de IVA crédito fiscal.
        diferenciaEstimada:
          $ref: '#/components/schemas/MontoConSigno'
          description: ivaDebito.total − ivaCredito.total.
        nota:
          type: string
          description: "Punto de partida para preparar la declaración de IVA; no la reemplaza (CLAUDE.md §10.5)."

    # --- Diagnóstico de mayorización (ADR-018, ADR-038 §9) ---
    DiferenciaMayorizacion:
      type: object
      description: Diferencia entre saldo_cuenta_mensual y la suma de las líneas de una cuenta, año y mes.
      required: [cuenta, anio, mes, saldoDebe, saldoHaber, lineasDebe, lineasHaber]
      properties:
        cuenta:
          $ref: '#/components/schemas/ResumenCuenta'
        anio:
          type: integer
          description: Año del saldo mensual con diferencia.
        mes:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes del saldo mensual con diferencia.
        saldoDebe:
          $ref: '#/components/schemas/Monto'
          description: total_debe almacenado en saldo_cuenta_mensual.
        saldoHaber:
          $ref: '#/components/schemas/Monto'
          description: total_haber almacenado en saldo_cuenta_mensual.
        lineasDebe:
          $ref: '#/components/schemas/Monto'
          description: Σ debe de asiento_linea para la cuenta, año y mes.
        lineasHaber:
          $ref: '#/components/schemas/Monto'
          description: Σ haber de asiento_linea para la cuenta, año y mes.
    DiagnosticoMayorizacion:
      type: object
      description: Resultado de verificar que saldo_cuenta_mensual sea igual a la suma de asiento_linea (ADR-018).
      required: [consistente, cantidadCuentasRevisadas, diferencias]
      properties:
        consistente:
          type: boolean
          description: true si no se encontró ninguna diferencia.
        cantidadCuentasRevisadas:
          type: integer
          description: Cantidad de combinaciones de cuenta, año y mes revisadas.
        diferencias:
          type: array
          description: Diferencias encontradas; vacío si consistente es true.
          items:
            $ref: '#/components/schemas/DiferenciaMayorizacion'

    # --- Webhook de operaciones de n8n (CLAUDE.md §12, ADR-017, ADR-020, ADR-039) ---
    OperacionN8n:
      type: object
      additionalProperties: true
      description: >-
        Cuerpo de una operación de negocio enviada por n8n. Es intencionalmente un objeto libre y sin
        properties en este contrato (el generador lo traduce a un Map<String, Object> en vez de una clase de
        modelo, ADR-039 §3): sus campos, siempre incluidos tipoOperacion (p. ej. CIERRE_INGRESOS_DIARIO) y
        version (entero, p. ej. 1), eligen el esquema JSON versionado
        api-spec/esquemas/operaciones/<tipo>/v<n>.json (en 1.0 solo cierre-ingresos-diario/v1.json), contra el
        que se valida el cuerpo ANTES de interpretarlo (regla 1.1.14 de CLAUDE.md). Un tipoOperacion o version
        no soportados responden 422 INT-002; un cuerpo que no cumple su esquema JSON, 400 INT-001 con la lista
        errores. Ver el ejemplo de esta petición en CLAUDE.md §12.3.
    ResumenOperacion:
      type: object
      description: Montos normalizados de una operación externa ya contabilizada (CLAUDE.md §12.5).
      required: [modoPrecio, baseGravada, iva, exento, noSujeto, total]
      properties:
        modoPrecio:
          $ref: '#/components/schemas/ModoPrecio'
          description: Modo de precio de la empresa con el que se separó el IVA.
        baseGravada:
          $ref: '#/components/schemas/Monto'
          description: Base gravada de la operación (ventas gravadas sin IVA).
        iva:
          $ref: '#/components/schemas/Monto'
          description: IVA débito fiscal calculado sobre la base gravada.
        exento:
          $ref: '#/components/schemas/Monto'
          description: Monto de ingresos exentos de la operación.
        noSujeto:
          $ref: '#/components/schemas/Monto'
          description: Monto de ingresos no sujetos de la operación.
        total:
          $ref: '#/components/schemas/Monto'
          description: baseGravada + iva + exento + noSujeto; debe ser igual a la suma de los cobros.
    ReferenciaAsiento:
      type: object
      description: Referencia corta al asiento generado por una operación externa.
      required: [id, anio, numero, fecha]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        anio:
          type: integer
          description: Año de la fecha contable; junto con numero forma el correlativo (N.º numero/anio).
        numero:
          type: integer
          format: int64
          description: Número correlativo del asiento dentro de la empresa y el año.
        fecha:
          $ref: '#/components/schemas/Fecha'
    EstadoOperacionExterna:
      type: string
      enum: [CONTABILIZADO, REVERTIDO]
      description: >-
        Estado de una operación externa; pasa a REVERTIDO cuando se revierte el asiento que generó
        (CLAUDE.md §12.8).
    OperacionContabilizada:
      type: object
      description: Resultado de contabilizar una operación externa de n8n (CLAUDE.md §12.7, ADR-039 §5).
      required: [operacionId, estado, asiento, resumen]
      properties:
        operacionId:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoOperacionExterna'
        asiento:
          $ref: '#/components/schemas/ReferenciaAsiento'
        resumen:
          $ref: '#/components/schemas/ResumenOperacion'

    # --- Bitácora de operaciones (CLAUDE.md §10.5, §13, ADR-038, ADR-039 §6) ---
    ClaseEntradaBitacora:
      type: string
      enum: [OPERACION, RECHAZO]
      description: >-
        Tabla de origen de la entrada de bitácora: OPERACION (operacion_externa, aceptada) o RECHAZO
        (intento_operacion_externa, rechazada).
    ResultadoBitacora:
      type: string
      enum: [CONTABILIZADO, REVERTIDO, RECHAZADO]
      description: Resultado de la entrada de bitácora, para filtrar el listado.
    EntradaBitacora:
      type: object
      description: >-
        Entrada de la bitácora unificada de operaciones y rechazos, sin datos personales. Los campos que no
        aplican a la clase de la entrada van nulos.
      required:
        - id
        - clase
        - resultado
        - tipoOperacion
        - sistemaOrigen
        - idExterno
        - fechaOperacion
        - total
        - codigoError
        - asientoId
        - recibidoEn
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clase:
          $ref: '#/components/schemas/ClaseEntradaBitacora'
        resultado:
          $ref: '#/components/schemas/ResultadoBitacora'
        tipoOperacion:
          oneOf:
            - $ref: '#/components/schemas/TipoOperacionContable'
            - type: 'null'
          description: Tipo de la operación; nulo si un rechazo no llegó a identificarlo.
        sistemaOrigen:
          type: [string, 'null']
          description: Sistema de origen de la operación; nulo si un rechazo no llegó a identificarlo.
        idExterno:
          type: [string, 'null']
          description: Identificador externo de la operación; nulo en un rechazo sin cuerpo legible.
        fechaOperacion:
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
          description: Fecha contable de la operación (clase OPERACION); nula en un RECHAZO.
        total:
          type: [string, 'null']
          pattern: '^\d{1,17}(\.\d{1,2})?$'
          examples: ['1180.00']
          description: >-
            Total normalizado de la operación como cadena decimal (ADR-013); nulo en un RECHAZO. El
            servidor siempre responde con exactamente 2 decimales.
        codigoError:
          type: [string, 'null']
          description: Código INT- o CON- del rechazo (clase RECHAZO); nulo en una OPERACION.
        asientoId:
          type: [string, 'null']
          format: uuid
          description: Asiento generado (clase OPERACION); nulo en un RECHAZO.
        recibidoEn:
          $ref: '#/components/schemas/FechaHora'
          description: Instante UTC en que Pilot recibió la petición.
    PaginaBitacora:
      description: Página de la bitácora, de la más reciente a la más antigua.
      allOf:
        - $ref: '#/components/schemas/PaginaCursor'
        - type: object
          required: [elementos]
          properties:
            elementos:
              type: array
              description: Entradas de la bitácora de la página.
              items:
                $ref: '#/components/schemas/EntradaBitacora'
    DetalleEntradaBitacora:
      description: Detalle de una entrada de la bitácora, con el resumen de la operación o el error del rechazo.
      allOf:
        - $ref: '#/components/schemas/EntradaBitacora'
        - type: object
          required: [idempotencyKey, resumen, error]
          properties:
            idempotencyKey:
              type: [string, 'null']
              description: Header Idempotency-Key con el que llegó la petición; nulo si no llegó a leerse.
            resumen:
              oneOf:
                - $ref: '#/components/schemas/ResumenOperacion'
                - type: 'null'
              description: Montos normalizados; solo en una entrada de clase OPERACION.
            error:
              oneOf:
                - $ref: '#/components/schemas/ProblemDetails'
                - type: 'null'
              description: Problem Details devuelto al rechazar la petición; solo en una entrada de clase RECHAZO.

  # --- Parámetros reutilizables ---
  parameters:
    XEmpresaId:
      name: X-Empresa-Id
      in: header
      required: true
      description: Empresa activa de la sesión; se valida contra las membresías del usuario (CLAUDE.md §4.5).
      schema:
        $ref: '#/components/schemas/Uuid'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de correlación; se genera si no viene y se devuelve en la respuesta.
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave de idempotencia de la operación; repetir la misma clave con el mismo cuerpo devuelve la respuesta original.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Limite:
      name: limite
      in: query
      required: false
      description: Cantidad máxima de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto como siguienteCursor en la página anterior.
      schema:
        type: string

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión leída del recurso; si no coincide con la actual se responde 412 PLT-016 (CLAUDE.md §8.3).
      schema:
        type: string
        minLength: 1
    EmpresaIdRuta:
      name: empresaId
      in: path
      required: true
      description: Empresa del recurso; debe ser igual al header X-Empresa-Id, si no responde 404 PLT-017.
      schema:
        $ref: '#/components/schemas/Uuid'
    CodigoAplicacion:
      name: codigo
      in: path
      required: true
      description: Código estable de la app del catálogo (p. ej. contabilidad).
      schema:
        type: string
        minLength: 1
        maxLength: 40
    ApiKeyIdRuta:
      name: apiKeyId
      in: path
      required: true
      description: Identificador de la API key.
      schema:
        $ref: '#/components/schemas/Uuid'

    CuentaIdRuta:
      name: cuentaId
      in: path
      required: true
      description: Identificador de la cuenta contable.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReglaIdRuta:
      name: reglaId
      in: path
      required: true
      description: Identificador de la regla de contabilización.
      schema:
        $ref: '#/components/schemas/Uuid'
    BusquedaCuenta:
      name: busqueda
      in: query
      required: false
      description: Texto a buscar en el código o el nombre de la cuenta, sin distinguir mayúsculas.
      schema:
        type: string
        maxLength: 100
    SoloDetalle:
      name: soloDetalle
      in: query
      required: false
      description: true devuelve solo las cuentas de detalle (las que aceptan movimientos).
      schema:
        type: boolean
        default: false
    SoloActivas:
      name: soloActivas
      in: query
      required: false
      description: true omite las cuentas inactivas.
      schema:
        type: boolean
        default: false
    TipoOperacionFiltro:
      name: tipoOperacion
      in: query
      required: false
      description: Limita las reglas a un tipo de operación (ADR-041; incluye los tipos guiados y CIERRE_INGRESOS_DIARIO).
      schema:
        $ref: '#/components/schemas/TipoOperacion'

    AsientoIdRuta:
      name: asientoId
      in: path
      required: true
      description: Identificador del asiento.
      schema:
        $ref: '#/components/schemas/Uuid'
    Desde:
      name: desde
      in: query
      required: false
      description: Fecha contable inicial, inclusive; no puede ser posterior a hasta.
      schema:
        $ref: '#/components/schemas/Fecha'
    Hasta:
      name: hasta
      in: query
      required: false
      description: Fecha contable final, inclusive.
      schema:
        $ref: '#/components/schemas/Fecha'
    AnioFiltro:
      name: anio
      in: query
      required: false
      description: Año de la fecha contable de los asientos.
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
    NumeroAsientoFiltro:
      name: numero
      in: query
      required: false
      description: Número correlativo del asiento (se combina con anio para ubicar uno solo).
      schema:
        type: integer
        format: int64
        minimum: 1
    OrigenAsientoFiltro:
      name: origen
      in: query
      required: false
      description: Limita el listado a un origen de asiento.
      schema:
        $ref: '#/components/schemas/OrigenAsiento'
    EstadoAsientoFiltro:
      name: estado
      in: query
      required: false
      description: Limita el listado a un estado de asiento.
      schema:
        $ref: '#/components/schemas/EstadoAsiento'
    CuentaIdFiltro:
      name: cuentaId
      in: query
      required: false
      description: Limita el listado a los asientos con alguna línea en esta cuenta.
      schema:
        $ref: '#/components/schemas/Uuid'

    # --- Operaciones guiadas y tablero (ADR-041) ---
    OperacionIdRuta:
      name: operacionId
      in: path
      required: true
      description: Identificador de la operación guiada.
      schema:
        $ref: '#/components/schemas/Uuid'
    TipoOperacionOperacionesFiltro:
      name: tipo
      in: query
      required: false
      description: Limita el listado de operaciones a un tipo (ADR-041).
      schema:
        $ref: '#/components/schemas/TipoOperacion'
    EstadoOperacionFiltro:
      name: estado
      in: query
      required: false
      description: Limita el listado de operaciones a un estado.
      schema:
        $ref: '#/components/schemas/EstadoOperacion'
    AnioTablero:
      name: anio
      in: query
      required: true
      description: Año del tablero.
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
    MesTablero:
      name: mes
      in: query
      required: true
      description: Mes del tablero (1 a 12).
      schema:
        type: integer
        minimum: 1
        maximum: 12

    # --- Reportes y exportaciones (ADR-038) ---
    CuentaIdMayor:
      name: cuentaId
      in: query
      required: true
      description: >-
        Cuenta del Libro Mayor; acepta cualquier cuenta, incluida una cuenta padre, cuyos movimientos son los de
        todas sus cuentas de detalle (ADR-038 §5).
      schema:
        $ref: '#/components/schemas/Uuid'
    FechaCorte:
      name: fechaCorte
      in: query
      required: true
      description: Fecha de corte del Estado de Situación Financiera, en hora de El Salvador.
      schema:
        $ref: '#/components/schemas/Fecha'
    NivelReporte:
      name: nivel
      in: query
      required: false
      description: >-
        Nivel del catálogo hasta el que se agrupan las filas del reporte (1 clase … 5 detalle, CLAUDE.md §10.2).
      schema:
        type: integer
        minimum: 1
        maximum: 5
        default: 5
    IncluirCeros:
      name: incluirCeros
      in: query
      required: false
      description: true incluye también las filas con monto en cero.
      schema:
        type: boolean
        default: false
    AnioReporte:
      name: anio
      in: query
      required: true
      description: Año del período del reporte.
      schema:
        type: integer
        minimum: 2000
        maximum: 9999
    MesReporte:
      name: mes
      in: query
      required: true
      description: Mes del período del reporte (1 a 12).
      schema:
        type: integer
        minimum: 1
        maximum: 12
    Formato:
      name: formato
      in: query
      required: true
      description: Formato del archivo a exportar (ADR-038).
      schema:
        $ref: '#/components/schemas/FormatoExportacion'
    DesdeReporte:
      name: desde
      in: query
      required: true
      description: Fecha contable inicial del período del reporte, inclusive; no puede ser posterior a hasta.
      schema:
        $ref: '#/components/schemas/Fecha'
    HastaReporte:
      name: hasta
      in: query
      required: true
      description: Fecha contable final del período del reporte, inclusive.
      schema:
        $ref: '#/components/schemas/Fecha'

    # --- Bitácora de operaciones (ADR-039 §6) ---
    EntradaIdRuta:
      name: entradaId
      in: path
      required: true
      description: Identificador de la entrada de bitácora (operación aceptada o rechazo).
      schema:
        $ref: '#/components/schemas/Uuid'
    DesdeRecepcion:
      name: desde
      in: query
      required: false
      description: Fecha de recepción inicial, inclusive; no puede ser posterior a hasta.
      schema:
        $ref: '#/components/schemas/Fecha'
    HastaRecepcion:
      name: hasta
      in: query
      required: false
      description: Fecha de recepción final, inclusive.
      schema:
        $ref: '#/components/schemas/Fecha'
    DesdeRecepcionExportacion:
      name: desde
      in: query
      required: true
      description: Fecha de recepción inicial de la exportación, inclusive; no puede ser posterior a hasta.
      schema:
        $ref: '#/components/schemas/Fecha'
    HastaRecepcionExportacion:
      name: hasta
      in: query
      required: true
      description: Fecha de recepción final de la exportación, inclusive.
      schema:
        $ref: '#/components/schemas/Fecha'
    ResultadoBitacoraFiltro:
      name: resultado
      in: query
      required: false
      description: Limita la bitácora a un resultado (CONTABILIZADO, REVERTIDO o RECHAZADO).
      schema:
        $ref: '#/components/schemas/ResultadoBitacora'
    SistemaOrigenFiltro:
      name: sistemaOrigen
      in: query
      required: false
      description: Limita la bitácora al sistema de origen indicado (app de origen del cierre).
      schema:
        type: string
        maxLength: 50

  # --- Headers reutilizables ---
  headers:
    X-Request-Id:
      description: Identificador de correlación de la petición, para soporte y trazas.
      schema:
        type: string
    ETag:
      description: Versión del recurso (su columna version) entre comillas; se envía como If-Match al editarlo.
      schema:
        type: string
    Idempotency-Replayed:
      description: Vale true cuando la respuesta es la guardada de una petición idempotente repetida.
      schema:
        type: boolean
    Retry-After:
      description: Segundos que el cliente debe esperar antes de reintentar.
      schema:
        type: integer
    Content-Disposition:
      description: >-
        Indica que la respuesta es un archivo adjunto, con un nombre de archivo legible según el reporte y el
        formato exportado (ADR-038).
      schema:
        type: string

  # --- Respuestas de error reutilizables (RFC 9457) ---
  responses:
    SolicitudInvalida:
      description: 400 — El cuerpo o los parámetros no cumplen el contrato (incluye la lista errores).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoAutenticado:
      description: 401 — Falta la credencial o es inválida, está vencida o fue revocada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Prohibido:
      description: 403 — La credencial es válida pero no tiene rol, alcance o app activa para esta operación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoEncontrado:
      description: 404 — El recurso no existe o no pertenece a la empresa activa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflicto:
      description: 409 — El estado actual del recurso impide la operación (duplicado o petición en proceso).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PrecondicionFallida:
      description: 412 — El header If-Match no coincide con la versión actual del recurso; volver a leerlo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CargaExcesiva:
      description: >-
        413 — El cuerpo de la petición supera el tamaño máximo admitido (1 MB en el webhook de n8n,
        CLAUDE.md §12.1, ADR-039 §2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    EntidadNoProcesable:
      description: 422 — La petición es válida en forma pero viola una regla de negocio (incluye diferencia si aplica).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PrecondicionRequerida:
      description: 428 — Falta un header obligatorio de precondición, como Idempotency-Key o If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DemasiadasPeticiones:
      description: 429 — Se superó el límite de peticiones; ver el header Retry-After.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErrorInterno:
      description: 500 — Error interno; no expone trazas ni mensajes internos. Reintentar es seguro con idempotencia.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
