# Contrato REST de Pilot 1.0 (fuente de verdad, ADR-003).
# Contract-first: las interfaces Spring y el cliente Orval se generan desde este archivo.
# Alcance de F4: los reportes contables en JSON (Libro Mayor, Balanza de Comprobación, Estado de
# Situación Financiera, Estado de Resultados, resumen de IVA y diagnóstico de mayorización, ADR-038) y
# sus exportaciones a PDF, XLSX y CSV como operaciones binarias propias, sobre el núcleo de F1 (usuario
# actual, empresa, catálogo de apps y API keys), el catálogo de cuentas y la configuración contable de
# F2, y el Libro Diario de F3 (registro, vista previa, consulta y reversión de asientos).
# Alcance de F5: el webhook de operaciones de n8n (POST /integraciones/n8n/operaciones, primer tipo
# CIERRE_INGRESOS_DIARIO), validado contra su esquema JSON versionado en
# api-spec/esquemas/operaciones/ antes de interpretarlo (regla 1.1.14), y la bitácora de operaciones
# aceptadas, revertidas y rechazadas con su exportación a PDF, XLSX y CSV (ADR-039), sobre el núcleo,
# el catálogo y configuración contable, el Libro Diario y los reportes de las fases anteriores.
openapi: 3.1.0

# --- Metadatos del contrato ---
info:
  title: Pilot API
  version: 1.0.0
  contact:
    name: bcodesphere
  description: >-
    API REST de Pilot, ERP multiempresa para PYMES de El Salvador. Incluye el núcleo
    (usuarios y empresas) y la app Contabilidad. Los montos viajan como cadena decimal
    con 2 decimales (ADR-013) y los errores siguen RFC 9457 (Problem Details).

# --- Servidores: ruta base relativa al host que sirve la API ---
servers:
  - url: /api/v1
    description: Ruta base de la versión 1 de la API.

# --- Etiquetas por módulo del backend (CLAUDE.md §4.2) ---
tags:
  # Una etiqueta por recurso: el generador crea una interfaz <Etiqueta>Api por etiqueta y cada controlador
  # implementa solo la suya (convención de CLAUDE.md §8.1). Las cuatro primeras son del módulo plataforma.
  - name: usuarioActual
    description: Módulo plataforma — usuario autenticado, sus membresías y su consentimiento de correos.
  - name: empresas
    description: Módulo plataforma — empresa activa (espacio de trabajo).
  - name: aplicaciones
    description: Módulo plataforma — catálogo de apps e instalación (ADR-030).
  - name: apiKeys
    description: Módulo plataforma — API keys de integración (n8n).
  # Etiquetas del módulo contabilidad (una por recurso). Solo responden si la app está instalada (PLT-004).
  - name: cuentasContables
    description: Módulo contabilidad — catálogo de cuentas contables de la empresa (CLAUDE.md §10.2, ADR-035).
  - name: configuracionContable
    description: Módulo contabilidad — modo de precio por defecto y cuentas de IVA de la empresa (CLAUDE.md §11.3).
  - name: reglasContabilizacion
    description: Módulo contabilidad — reglas que asignan una cuenta a cada concepto o forma de pago (ADR-020).
  - name: asientos
    description: "Módulo contabilidad — Libro Diario: registro, vista previa, consulta y reversión de asientos."
  - name: reportesContables
    description: >-
      Módulo contabilidad — reportes en JSON: Libro Mayor, Balanza de Comprobación, Estado de Situación
      Financiera, Estado de Resultados, resumen de IVA y diagnóstico de mayorización (ADR-038).
  - name: exportacionesContables
    description: Módulo contabilidad — exportación de reportes a PDF, XLSX y CSV (ADR-038).
  - name: operacionesN8n
    description: >-
      Módulo integración — webhook de operaciones de negocio enviadas por n8n (CLAUDE.md §12, ADR-017,
      ADR-020, ADR-039).
  - name: bitacoraOperaciones
    description: >-
      Módulo integración — bitácora de operaciones aceptadas, revertidas y rechazadas (CLAUDE.md §10.5,
      ADR-039).

# --- Seguridad global: usuarios con OIDC; las rutas de n8n sobrescriben con apiKey ---
security:
  - oidc: []

paths:
  # --- Usuario actual (ADR-028): sin X-Empresa-Id porque sirve para elegir la empresa activa ---
  /me:
    get:
      operationId: obtenerUsuarioActual
      tags: [usuarioActual]
      x-rol-minimo: autenticado
      summary: Usuario actual y sus membresías
      description: >-
        Devuelve el usuario autenticado, su consentimiento de correos de recomendaciones y las empresas a las que
        pertenece con su rol en cada una (solo membresías activas). No requiere el header X-Empresa-Id porque se
        usa justamente para elegir la empresa activa. Rol mínimo: autenticado.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Usuario autenticado con sus membresías activas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarUsuarioActual
      tags: [usuarioActual]
      x-rol-minimo: autenticado
      summary: Retira o vuelve a dar el consentimiento de correos
      description: >-
        Actualiza solo el consentimiento "Acepto recibir recomendaciones por correo" (ADR-028). Nombre, correo y
        teléfono no se editan aquí: su fuente de verdad es Keycloak. No requiere X-Empresa-Id. Rol mínimo: autenticado.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        description: Nuevo estado del consentimiento de correos de recomendaciones.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionUsuarioActual'
      responses:
        '200':
          description: Usuario con el consentimiento actualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Empresa activa (ADR-029): concurrencia optimista con ETag e If-Match (CLAUDE.md §8.3) ---
  /empresas/{empresaId}:
    get:
      operationId: obtenerEmpresa
      tags: [empresas]
      x-rol-minimo: admin_empresa
      summary: Consulta la empresa activa
      description: >-
        Devuelve la empresa activa. {empresaId} debe ser igual a X-Empresa-Id; si no lo es, responde 404 PLT-017
        para no revelar la existencia de otras empresas. La respuesta trae el header ETag con la versión actual, que
        debe enviarse como If-Match al editar. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/EmpresaIdRuta'
      responses:
        '200':
          description: Empresa activa con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: {empresaId} no coincide con X-Empresa-Id o la empresa no existe."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarEmpresa
      tags: [empresas]
      x-rol-minimo: admin_empresa
      summary: Edita la empresa activa
      description: >-
        Cambia el nombre del espacio de trabajo (empresa activa). Es lo único editable en la versión abierta: los
        usuarios son personas naturales y no se capturan datos empresariales (ADR-031, ADR-032); cada app guarda su
        propia configuración. Exige If-Match con el ETag leído
        (concurrencia optimista) y devuelve el nuevo ETag. {empresaId} debe ser igual a X-Empresa-Id; si no, 404
        PLT-017. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/EmpresaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Nuevo nombre del espacio de trabajo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionEmpresa'
      responses:
        '200':
          description: Empresa actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: {empresaId} no coincide con X-Empresa-Id o la empresa no existe."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual de la empresa; volver a leerla."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Catálogo de apps (ADR-030): sin desinstalación en 1.0 ---
  /aplicaciones:
    get:
      operationId: listarAplicaciones
      tags: [aplicaciones]
      x-rol-minimo: auditor
      summary: Catálogo de apps con su estado para la empresa activa
      description: >-
        Devuelve el catálogo completo de apps, ordenado por el orden del catálogo, con su estado para la empresa
        activa: INSTALADA, DISPONIBLE (comunitaria aún no instalada) o BLOQUEADA_ENTERPRISE. No se pagina porque el
        catálogo es corto y global. Rol mínimo: auditor (cualquier miembro activo).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      responses:
        '200':
          description: Catálogo de apps con su estado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AplicacionCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /aplicaciones/{codigo}/instalacion:
    post:
      operationId: instalarAplicacion
      tags: [aplicaciones]
      x-rol-minimo: admin_empresa
      summary: Instala una app comunitaria en la empresa activa
      description: >-
        Instala la app indicada y ejecuta su precarga en la misma transacción; si la precarga falla, la instalación
        se revierte. Responde 201 si la instaló ahora y 200 si ya estaba instalada. No existe desinstalación en 1.0.
        Las apps Enterprise no se pueden instalar (403 PLT-011). Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CodigoAplicacion'
      responses:
        '201':
          description: App instalada ahora.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AplicacionCatalogo'
        '200':
          description: La app ya estaba instalada; se devuelve su estado actual.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AplicacionCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación; PLT-011: la app es de la edición Enterprise y no se puede instalar."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el código de app no existe en el catálogo."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- API keys de integración (n8n): el secreto completo solo se ve al crearlas ---
  /api-keys:
    get:
      operationId: listarApiKeys
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Lista las API keys de la empresa
      description: >-
        Lista paginada por cursor de las API keys de la empresa activa, incluidas las revocadas. Nunca devuelve el
        secreto ni su hash. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de API keys sin secretos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApiKeys'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearApiKey
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Crea una API key
      description: >-
        Crea una API key con los alcances indicados. El secreto completo (pk_xxxx.secreto) se muestra una sola vez
        en esta respuesta y no se puede recuperar después; el servidor guarda solo su hash Argon2id. Rol mínimo:
        admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      requestBody:
        required: true
        description: Nombre, alcances y expiración opcional de la nueva API key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaApiKey'
      responses:
        '201':
          description: API key creada; incluye el secreto una única vez.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreada'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api-keys/{apiKeyId}:
    delete:
      operationId: revocarApiKey
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Revoca una API key
      description: >-
        Revoca la API key de forma definitiva. Es idempotente: revocar una clave ya revocada también responde 204.
        Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/ApiKeyIdRuta'
      responses:
        '204':
          description: API key revocada (o ya lo estaba).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  # --- Catálogo de cuentas (CLAUDE.md §10.2, ADR-035): completo y sin paginar; concurrencia con ETag/If-Match ---
  /contabilidad/cuentas:
    get:
      operationId: listarCuentasContables
      tags: [cuentasContables]
      x-rol-minimo: auditor
      summary: Lista el catálogo completo de cuentas
      description: >-
        Devuelve el catálogo de cuentas de la empresa completo y sin paginar, ordenado por código, para armar el árbol y
        la búsqueda en el cliente (ADR-035). Los filtros son opcionales y se combinan: busqueda (código o nombre, sin
        distinguir mayúsculas), soloDetalle (solo cuentas que aceptan movimientos) y soloActivas. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/BusquedaCuenta'
        - $ref: '#/components/parameters/SoloDetalle'
        - $ref: '#/components/parameters/SoloActivas'
      responses:
        '200':
          description: Catálogo de cuentas ordenado por código.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuentaContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma de los parámetros (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: contador
      summary: Crea una cuenta contable
      description: >-
        Crea una cuenta del catálogo. La cuenta padre no se envía: se deduce del código, porque el código del padre
        es prefijo del de la hija (ADR-035). La clase es el primer dígito del código; la naturaleza por defecto sale de la
        clase (deudora en 1 y 4, acreedora en 2, 3 y 5) y se puede indicar otra para cuentas complementarias. Rol mínimo:
        contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      requestBody:
        required: true
        description: Código, nombre y naturaleza opcional de la nueva cuenta.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCuentaContable'
      responses:
        '201':
          description: Cuenta creada con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — CON-014: el código ya existe en el catálogo de la empresa."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-010: el primer dígito del código no es una clase de 1 a 5; CON-011: la cuenta padre tiene movimientos; CON-015: longitud de código no válida (1, 2, 4, 6 u 8 dígitos) o sin cuenta padre existente y activa cuyo código sea su prefijo; PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/cuentas/{cuentaId}:
    get:
      operationId: obtenerCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: auditor
      summary: Consulta una cuenta contable
      description: >-
        Devuelve una cuenta del catálogo con el header ETag de su versión actual, que debe enviarse como If-Match al
        editarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CuentaIdRuta'
      responses:
        '200':
          description: Cuenta con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: contador
      summary: Edita una cuenta contable
      description: >-
        Cambia el código, el nombre, la naturaleza o el estado activa de una cuenta; solo se envían los campos a
        cambiar. Exige If-Match con el ETag leído (concurrencia optimista) y devuelve el nuevo ETag. El código no puede
        cambiarse si la cuenta tiene movimientos (CON-011) y una cuenta con saldo distinto de cero no puede desactivarse
        (CON-012). Si la cuenta está en uso por la configuración contable o por una regla activa, no se puede desactivar ni
        dejar de ser de detalle (CON-016). Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CuentaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Campos de la cuenta a modificar (al menos uno).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionCuentaContable'
      responses:
        '200':
          description: Cuenta actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — CON-014: el nuevo código ya existe en el catálogo de la empresa."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-010: el primer dígito del código no es una clase de 1 a 5; CON-011: cambiar el código de una cuenta con movimientos, o crear una hija en una cuenta con movimientos; CON-012: desactivar una cuenta con saldo distinto de cero; CON-015: longitud de código no válida o sin cuenta padre existente y activa cuyo código sea su prefijo; CON-016: la cuenta está en uso por la configuración contable o por una regla activa; PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Configuración contable (CLAUDE.md §11.3): una por empresa, PUT completo ---
  /contabilidad/configuracion:
    get:
      operationId: obtenerConfiguracionContable
      tags: [configuracionContable]
      x-rol-minimo: auditor
      summary: Consulta la configuración contable
      description: >-
        Devuelve el modo de precio por defecto y las cuentas de IVA débito y crédito fiscal de la empresa. La respuesta
        trae el header ETag con la versión actual, que debe enviarse como If-Match al reemplazarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      responses:
        '200':
          description: Configuración contable con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: la empresa no tiene configuración contable."
        '429':
