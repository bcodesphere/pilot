  # --- Webhook de n8n (CLAUDE.md §12, ADR-017, ADR-020, ADR-039): solo apiKey, la empresa sale de la clave ---
  /integraciones/n8n/operaciones:
    post:
      operationId: recibirOperacionN8n
      tags: [operacionesN8n]
      x-rol-minimo: integracion
      security:
        - apiKey: []
      summary: Recibe y contabiliza una operación de negocio de n8n
      description: >-
        Recibe una operación de negocio (en 1.0 solo CIERRE_INGRESOS_DIARIO) enviada por n8n con una API key de
        alcance integracion:operaciones; la empresa se deriva de la clave, por eso esta ruta no lleva
        X-Empresa-Id. El cuerpo se valida contra su esquema JSON versionado antes de interpretarlo (regla 1.1.14),
        se normaliza con el modo de precio de la empresa y la tasa de IVA vigente a la fecha (CLAUDE.md §12.5) y
        genera un asiento por las reglas de contabilización, en la misma transacción que la operación y el
        registro de idempotencia (ADR-017, ADR-020). Exige Idempotency-Key: repetir la misma clave con el mismo
        cuerpo devuelve la respuesta original con su mismo estado HTTP (201 o 409 INT-004) e
        Idempotency-Replayed true (ADR-039 §1). n8n no crea asientos ni indica cuentas (regla 1.2.4). Rol
        mínimo: integracion (rol técnico de la API key, CLAUDE.md §14.2).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Operación de negocio; tipoOperacion y version eligen su esquema JSON versionado (CLAUDE.md §12.3).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperacionN8n'
            example:
              tipoOperacion: CIERRE_INGRESOS_DIARIO
              version: 1
              sistemaOrigen: app-ventas-web
              idExterno: CIERRE-2026-10-15-SUC01
              fecha: '2026-10-15'
              sucursal: Sucursal Centro
              descripcion: Cierre de caja del día
              ingresos:
                - concepto: VENTAS_GRAVADAS
                  monto: '1130.00'
                - concepto: VENTAS_EXENTAS
                  monto: '50.00'
              cobros:
                - formaPago: EFECTIVO
                  monto: '780.00'
                - formaPago: TARJETA
                  monto: '400.00'
              totalCobrado: '1180.00'
      responses:
        '201':
          description: >-
            Operación contabilizada. Si es la repetición de una petición idempotente, es la respuesta original
            (201 o, si el cierre ya estaba contabilizado, 409 INT-004) con Idempotency-Replayed true.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionContabilizada'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: >-
            400 — INT-001: el cuerpo no cumple su esquema JSON versionado (incluye errores), o tiene códigos
            repetidos en ingresos o en cobros, o no tiene al menos un ingreso y un cobro mayores que cero. No
            reintentar sin corregir el flujo o la app.
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: la API key falta, es inválida, está vencida o fue revocada. No reintentar."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: >-
            403 — PLT-004: la app Contabilidad no está instalada en la empresa de la API key; PLT-010: la API
            key no tiene el alcance integracion:operaciones. No reintentar.
        '409':
          $ref: '#/components/responses/Conflicto'
          description: >-
            409 — INT-004: el cierre ya está contabilizado (incluye operacionId y asientoId); tratar como
            éxito, no reintentar. INT-009: otra petición del mismo cierre está en proceso; reintentar tras unos
            segundos.
        '413':
          $ref: '#/components/responses/CargaExcesiva'
          description: "413 — INT-010: el cuerpo supera 1 MB. No reintentar; dividir o corregir el envío."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: >-
            422 — INT-002: tipoOperacion o version no soportados; INT-005: Idempotency-Key reutilizada con otro
            cuerpo; INT-006: la suma de cobros no cuadra con la operación normalizada, o totalCobrado no
            coincide con la suma de cobros (incluye diferencia); CON-007: fecha futura; CON-020: un concepto o
            forma de pago usado no tiene regla activa ni cuenta, o falta la cuenta de IVA débito. No reintentar
            sin corregir el cierre o la configuración de Pilot (CON-020 sí puede reintentarse tras configurar).
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — INT-008: falta el header Idempotency-Key. No reintentar sin corregir el flujo."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
          description: "429 — Límite de peticiones superado; reintentar respetando Retry-After."
        '500':
          $ref: '#/components/responses/ErrorInterno'
          description: "500 — Error interno; reintentar con espera exponencial es seguro gracias a la idempotencia."

  # --- Bitácora de operaciones (CLAUDE.md §10.5, §13, ADR-039 §6): usuarios con OIDC y X-Empresa-Id ---
  /integraciones/operaciones:
    get:
      operationId: listarBitacora
      tags: [bitacoraOperaciones]
      x-rol-minimo: auditor
      summary: Bitácora de operaciones y rechazos
