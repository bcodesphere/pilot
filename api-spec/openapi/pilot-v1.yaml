  /contabilidad/asientos/{asientoId}/reversion:
    post:
      operationId: revertirAsiento
      tags: [asientos]
      x-rol-minimo: contador
      summary: Revierte un asiento
      description: >-
        Crea un asiento de reversión con el Debe y el Haber intercambiados, concepto fijo "Reversión del asiento N.º
        <numero>/<anio>" y estado CONTABILIZADO, y marca el original como REVERTIDO; mayoriza igual que cualquier
        asiento, así que los saldos vuelven a su valor anterior (CLAUDE.md §10.1, ADR-019, ADR-036). La fecha es
        opcional (por defecto hoy en hora de El Salvador); no puede ser futura ni anterior a la del asiento original. Un
        asiento ya revertido o una reversión no pueden revertirse. Exige Idempotency-Key. Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/AsientoIdRuta'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        description: Fecha contable de la reversión; el cuerpo completo es opcional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReversion'
      responses:
        '201':
          description: Asiento de reversión contabilizado. Si es la repetición de una petición idempotente, es la respuesta original.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — CON-008: el asiento ya está revertido; CON-009: una reversión no se revierte; PLT-008: otra petición con la misma Idempotency-Key está en proceso; reintentar."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-007: la fecha de la reversión es futura; CON-018: la fecha es anterior a la del asiento original; PLT-002: validación de forma (incluye errores); PLT-005: Idempotency-Key reutilizada con otro cuerpo."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-006: falta el header Idempotency-Key."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

