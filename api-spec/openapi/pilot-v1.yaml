        activa exige una cuenta (PLT-002 si activa es true y cuentaId es nulo, ADR-035); la cuenta debe existir,
        estar activa, ser de detalle (CON-006) y tener un código que empiece por el prefijoPermitido de la regla
        (CON-022, ADR-042). Rol mínimo: contador.
