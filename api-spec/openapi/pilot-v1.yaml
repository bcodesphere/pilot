        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DesdeRecepcion'
        - $ref: '#/components/parameters/HastaRecepcion'
        - $ref: '#/components/parameters/ResultadoBitacoraFiltro'
        - $ref: '#/components/parameters/SistemaOrigenFiltro'
