        Lista paginada por cursor, de la más reciente a la más antigua, de las operaciones aceptadas
        (contabilizadas o revertidas) y los rechazos de n8n, para que el contador detecte cierres que no
        entraron y corrija la configuración (CLAUDE.md §10.5). Los filtros son opcionales y se combinan: desde
        y hasta (fecha de recepción, ambos inclusive), resultado y sistemaOrigen. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
