# Contrato REST de Pilot 1.0 (fuente de verdad, ADR-003).
# Contract-first: las interfaces Spring y el cliente Orval se generan desde este archivo.
# Alcance de F2: núcleo de F1 (usuario actual, empresa, catálogo de apps y API keys) más el catálogo de
# cuentas, la configuración contable y las reglas de contabilización. Asientos, reportes e integración
# llegan en F3–F5.
openapi: 3.1.0

# --- Metadatos del contrato ---
info:
  title: Pilot API
  version: 1.0.0
  contact:
    name: bcodesphere
  description: >-
    API REST de Pilot, ERP multiempresa para PYMES de El Salvador. Incluye el núcleo
    (usuarios y empresas) y la app Contabilidad. Los montos viajan como cadena decimal
    con 2 decimales (ADR-013) y los errores siguen RFC 9457 (Problem Details).

# --- Servidores: ruta base relativa al host que sirve la API ---
servers:
  - url: /api/v1
    description: Ruta base de la versión 1 de la API.

# --- Etiquetas por módulo del backend (CLAUDE.md §4.2) ---
tags:
  # Una etiqueta por recurso: el generador crea una interfaz <Etiqueta>Api por etiqueta y cada controlador
  # implementa solo la suya (convención de CLAUDE.md §8.1). Las cuatro primeras son del módulo plataforma.
  - name: usuarioActual
    description: Módulo plataforma — usuario autenticado, sus membresías y su consentimiento de correos.
  - name: empresas
    description: Módulo plataforma — empresa activa (espacio de trabajo).
  - name: aplicaciones
    description: Módulo plataforma — catálogo de apps e instalación (ADR-030).
  - name: apiKeys
    description: Módulo plataforma — API keys de integración (n8n).
  # Etiquetas del módulo contabilidad (una por recurso). Solo responden si la app está instalada (PLT-004).
  - name: cuentasContables
    description: Módulo contabilidad — catálogo de cuentas contables de la empresa (CLAUDE.md §10.2, ADR-035).
  - name: configuracionContable
    description: Módulo contabilidad — modo de precio por defecto y cuentas de IVA de la empresa (CLAUDE.md §11.3).
  - name: reglasContabilizacion
    description: Módulo contabilidad — reglas que asignan una cuenta a cada concepto o forma de pago (ADR-020).
  - name: integracion
    description: Webhook de n8n y bitácora de operaciones externas.

# --- Seguridad global: usuarios con OIDC; las rutas de n8n sobrescriben con apiKey ---
security:
  - oidc: []

paths:
  # --- Usuario actual (ADR-028): sin X-Empresa-Id porque sirve para elegir la empresa activa ---
  /me:
    get:
      operationId: obtenerUsuarioActual
      tags: [usuarioActual]
      x-rol-minimo: autenticado
      summary: Usuario actual y sus membresías
      description: >-
        Devuelve el usuario autenticado, su consentimiento de correos de recomendaciones y las empresas a las que
        pertenece con su rol en cada una (solo membresías activas). No requiere el header X-Empresa-Id porque se
        usa justamente para elegir la empresa activa. Rol mínimo: autenticado.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Usuario autenticado con sus membresías activas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarUsuarioActual
      tags: [usuarioActual]
      x-rol-minimo: autenticado
      summary: Retira o vuelve a dar el consentimiento de correos
      description: >-
        Actualiza solo el consentimiento "Acepto recibir recomendaciones por correo" (ADR-028). Nombre, correo y
        teléfono no se editan aquí: su fuente de verdad es Keycloak. No requiere X-Empresa-Id. Rol mínimo: autenticado.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        description: Nuevo estado del consentimiento de correos de recomendaciones.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionUsuarioActual'
      responses:
        '200':
          description: Usuario con el consentimiento actualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Empresa activa (ADR-029): concurrencia optimista con ETag e If-Match (CLAUDE.md §8.3) ---
  /empresas/{empresaId}:
    get:
      operationId: obtenerEmpresa
      tags: [empresas]
      x-rol-minimo: admin_empresa
      summary: Consulta la empresa activa
      description: >-
        Devuelve la empresa activa. {empresaId} debe ser igual a X-Empresa-Id; si no lo es, responde 404 PLT-017
        para no revelar la existencia de otras empresas. La respuesta trae el header ETag con la versión actual, que
        debe enviarse como If-Match al editar. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/EmpresaIdRuta'
      responses:
        '200':
          description: Empresa activa con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: {empresaId} no coincide con X-Empresa-Id o la empresa no existe."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarEmpresa
      tags: [empresas]
      x-rol-minimo: admin_empresa
      summary: Edita la empresa activa
      description: >-
        Cambia el nombre del espacio de trabajo (empresa activa). Es lo único editable en la versión abierta: los
        usuarios son personas naturales y no se capturan datos empresariales (ADR-031, ADR-032); cada app guarda su
        propia configuración. Exige If-Match con el ETag leído
        (concurrencia optimista) y devuelve el nuevo ETag. {empresaId} debe ser igual a X-Empresa-Id; si no, 404
        PLT-017. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/EmpresaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Nuevo nombre del espacio de trabajo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionEmpresa'
      responses:
        '200':
          description: Empresa actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: {empresaId} no coincide con X-Empresa-Id o la empresa no existe."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual de la empresa; volver a leerla."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Catálogo de apps (ADR-030): sin desinstalación en 1.0 ---
  /aplicaciones:
    get:
      operationId: listarAplicaciones
      tags: [aplicaciones]
      x-rol-minimo: auditor
      summary: Catálogo de apps con su estado para la empresa activa
      description: >-
        Devuelve el catálogo completo de apps, ordenado por el orden del catálogo, con su estado para la empresa
        activa: INSTALADA, DISPONIBLE (comunitaria aún no instalada) o BLOQUEADA_ENTERPRISE. No se pagina porque el
        catálogo es corto y global. Rol mínimo: auditor (cualquier miembro activo).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      responses:
        '200':
          description: Catálogo de apps con su estado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AplicacionCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /aplicaciones/{codigo}/instalacion:
    post:
      operationId: instalarAplicacion
      tags: [aplicaciones]
      x-rol-minimo: admin_empresa
      summary: Instala una app comunitaria en la empresa activa
      description: >-
        Instala la app indicada y ejecuta su precarga en la misma transacción; si la precarga falla, la instalación
        se revierte. Responde 201 si la instaló ahora y 200 si ya estaba instalada. No existe desinstalación en 1.0.
        Las apps Enterprise no se pueden instalar (403 PLT-011). Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CodigoAplicacion'
      responses:
        '201':
          description: App instalada ahora.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AplicacionCatalogo'
        '200':
          description: La app ya estaba instalada; se devuelve su estado actual.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AplicacionCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación; PLT-011: la app es de la edición Enterprise y no se puede instalar."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el código de app no existe en el catálogo."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- API keys de integración (n8n): el secreto completo solo se ve al crearlas ---
  /api-keys:
    get:
      operationId: listarApiKeys
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Lista las API keys de la empresa
      description: >-
        Lista paginada por cursor de las API keys de la empresa activa, incluidas las revocadas. Nunca devuelve el
        secreto ni su hash. Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de API keys sin secretos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApiKeys'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearApiKey
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Crea una API key
      description: >-
        Crea una API key con los alcances indicados. El secreto completo (pk_xxxx.secreto) se muestra una sola vez
        en esta respuesta y no se puede recuperar después; el servidor guarda solo su hash Argon2id. Rol mínimo:
        admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      requestBody:
        required: true
        description: Nombre, alcances y expiración opcional de la nueva API key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaApiKey'
      responses:
        '201':
          description: API key creada; incluye el secreto una única vez.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreada'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api-keys/{apiKeyId}:
    delete:
      operationId: revocarApiKey
      tags: [apiKeys]
      x-rol-minimo: admin_empresa
      summary: Revoca una API key
      description: >-
        Revoca la API key de forma definitiva. Es idempotente: revocar una clave ya revocada también responde 204.
        Rol mínimo: admin_empresa.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/ApiKeyIdRuta'
      responses:
        '204':
          description: API key revocada (o ya lo estaba).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  # --- Catálogo de cuentas (CLAUDE.md §10.2, ADR-035): completo y sin paginar; concurrencia con ETag/If-Match ---
  /contabilidad/cuentas:
    get:
      operationId: listarCuentasContables
      tags: [cuentasContables]
      x-rol-minimo: auditor
      summary: Lista el catálogo completo de cuentas
      description: >-
        Devuelve el catálogo de cuentas de la empresa completo y sin paginar, ordenado por código, para armar el árbol y
        la búsqueda en el cliente (ADR-035). Los filtros son opcionales y se combinan: busqueda (código o nombre, sin
        distinguir mayúsculas), soloDetalle (solo cuentas que aceptan movimientos) y soloActivas. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/BusquedaCuenta'
        - $ref: '#/components/parameters/SoloDetalle'
        - $ref: '#/components/parameters/SoloActivas'
      responses:
        '200':
          description: Catálogo de cuentas ordenado por código.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuentaContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma de los parámetros (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: contador
      summary: Crea una cuenta contable
      description: >-
        Crea una cuenta del catálogo. La cuenta padre no se envía: se deduce del código, porque el código del padre
        es prefijo del de la hija (ADR-035). La clase es el primer dígito del código; la naturaleza por defecto sale de la
        clase (deudora en 1 y 4, acreedora en 2, 3 y 5) y se puede indicar otra para cuentas complementarias. Rol mínimo:
        contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      requestBody:
        required: true
        description: Código, nombre y naturaleza opcional de la nueva cuenta.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCuentaContable'
      responses:
        '201':
          description: Cuenta creada con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — CON-014: el código ya existe en el catálogo de la empresa."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-010: el primer dígito del código no es una clase de 1 a 5; CON-011: la cuenta padre tiene movimientos; CON-015: longitud de código no válida (1, 2, 4, 6 u 8 dígitos) o sin cuenta padre existente y activa cuyo código sea su prefijo; PLT-002: validación de forma (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/cuentas/{cuentaId}:
    get:
      operationId: obtenerCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: auditor
      summary: Consulta una cuenta contable
      description: >-
        Devuelve una cuenta del catálogo con el header ETag de su versión actual, que debe enviarse como If-Match al
        editarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CuentaIdRuta'
      responses:
        '200':
          description: Cuenta con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarCuentaContable
      tags: [cuentasContables]
      x-rol-minimo: contador
      summary: Edita una cuenta contable
      description: >-
        Cambia el código, el nombre, la naturaleza o el estado activa de una cuenta; solo se envían los campos a
        cambiar. Exige If-Match con el ETag leído (concurrencia optimista) y devuelve el nuevo ETag. El código no puede
        cambiarse si la cuenta tiene movimientos (CON-011) y una cuenta con saldo distinto de cero no puede desactivarse
        (CON-012). Si la cuenta está en uso por la configuración contable o por una regla activa, no se puede desactivar ni
        dejar de ser de detalle (CON-016). Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/CuentaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Campos de la cuenta a modificar (al menos uno).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionCuentaContable'
      responses:
        '200':
          description: Cuenta actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '409':
          $ref: '#/components/responses/Conflicto'
          description: "409 — CON-014: el nuevo código ya existe en el catálogo de la empresa."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-010: el primer dígito del código no es una clase de 1 a 5; CON-011: cambiar el código de una cuenta con movimientos, o crear una hija en una cuenta con movimientos; CON-012: desactivar una cuenta con saldo distinto de cero; CON-015: longitud de código no válida o sin cuenta padre existente y activa cuyo código sea su prefijo; CON-016: la cuenta está en uso por la configuración contable o por una regla activa; PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Configuración contable (CLAUDE.md §11.3): una por empresa, PUT completo ---
  /contabilidad/configuracion:
    get:
      operationId: obtenerConfiguracionContable
      tags: [configuracionContable]
      x-rol-minimo: auditor
      summary: Consulta la configuración contable
      description: >-
        Devuelve el modo de precio por defecto y las cuentas de IVA débito y crédito fiscal de la empresa. La respuesta
        trae el header ETag con la versión actual, que debe enviarse como If-Match al reemplazarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
      responses:
        '200':
          description: Configuración contable con su ETag de versión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionContable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: la empresa no tiene configuración contable."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: actualizarConfiguracionContable
      tags: [configuracionContable]
      x-rol-minimo: contador
      summary: Reemplaza la configuración contable
      description: >-
        Reemplaza la configuración completa (modo de precio y ambas cuentas de IVA). Exige If-Match con el ETag leído y
        devuelve el nuevo ETag. Cada cuenta debe existir en la empresa, estar activa y ser de detalle (CON-006). El cambio
        queda en la auditoría y aplica solo a los asientos futuros (CLAUDE.md §11.3). Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Configuración completa que reemplaza a la actual.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionConfiguracionContable'
      responses:
        '200':
          description: Configuración actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionContable'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: la empresa no tiene configuración contable."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-006: una cuenta no existe en la empresa, está inactiva o no es de detalle; PLT-002: validación de forma (incluye errores)."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # --- Reglas de contabilización (ADR-020, ADR-035): cuenta por tipo de operación × categoría × código ---
  /contabilidad/reglas-contabilizacion:
    get:
      operationId: listarReglasContabilizacion
      tags: [reglasContabilizacion]
      x-rol-minimo: auditor
      summary: Lista las reglas de contabilización
      description: >-
        Devuelve las reglas de contabilización de la empresa, sin paginar, ordenadas por tipo de operación, categoría y
        código. El filtro tipoOperacion es opcional. Cada regla trae su version, que es el valor que se envía entre
        comillas como If-Match al editarla. Rol mínimo: auditor.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/TipoOperacionFiltro'
      responses:
        '200':
          description: Reglas ordenadas por tipo de operación, categoría y código.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReglaContabilizacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: parámetros con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — PLT-002: validación de forma de los parámetros (incluye errores)."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /contabilidad/reglas-contabilizacion/{reglaId}:
    put:
      operationId: actualizarReglaContabilizacion
      tags: [reglasContabilizacion]
      x-rol-minimo: contador
      summary: Reemplaza una regla de contabilización
      description: >-
        Reemplaza la cuenta y el estado de una regla; el tipo de operación, la categoría y el código no cambian.
        No existe GET individual, así que If-Match es la version de la regla (leída del listado) entre comillas, con el
        mismo formato del ETag; la respuesta devuelve el nuevo ETag. Una regla activa exige una cuenta (PLT-002 si
        activa es true y cuentaId es nulo, ADR-035); la cuenta debe existir, estar activa y ser de detalle (CON-006).
        Rol mínimo: contador.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XEmpresaId'
        - $ref: '#/components/parameters/ReglaIdRuta'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Cuenta y estado de la regla.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionReglaContabilizacion'
      responses:
        '200':
          description: Regla actualizada con su nuevo ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReglaContabilizacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
          description: "400 — PLT-001: cuerpo JSON ilegible o con tipos incorrectos."
        '401':
          $ref: '#/components/responses/NoAutenticado'
          description: "401 — PLT-009: falta el token, es inválido o está vencido."
        '403':
          $ref: '#/components/responses/Prohibido'
          description: "403 — PLT-003: el usuario no tiene membresía activa en X-Empresa-Id; PLT-004: la app Contabilidad no está instalada en la empresa; PLT-010: el rol no alcanza para esta operación."
        '404':
          $ref: '#/components/responses/NoEncontrado'
          description: "404 — PLT-017: el recurso no existe o no pertenece a la empresa activa."
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
          description: "412 — PLT-016: If-Match no coincide con la versión actual; volver a leer el recurso."
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
          description: "422 — CON-006: la cuenta no existe en la empresa, está inactiva o no es de detalle; PLT-002: validación de forma (incluye errores), o activa es true con cuentaId nulo."
        '428':
          $ref: '#/components/responses/PrecondicionRequerida'
          description: "428 — PLT-015: falta el header If-Match."
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  # --- Esquemas de seguridad ---
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso JWT emitido por Keycloak (OIDC con PKCE) para usuarios de la web.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_xxxx.secreto
      description: API key de integración con formato pk_xxxx.secreto, usada por n8n; la empresa se deriva de la clave.

  # --- Esquemas reutilizables ---
  schemas:
    Monto:
      type: string
      pattern: '^\d{1,17}(\.\d{1,2})?$'
      examples: ['123.45']
      description: >-
        Monto en USD no negativo como cadena decimal con máximo 2 decimales (ADR-013); nunca número JSON.
        El servidor siempre responde con exactamente 2 decimales.
    MontoConSigno:
      type: string
      pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      examples: ['-10.50']
      description: >-
        Monto en USD que puede ser negativo (p. ej. una diferencia), como cadena decimal con máximo
        2 decimales (ADR-013). El servidor siempre responde con exactamente 2 decimales.
    Uuid:
      type: string
      format: uuid
      description: Identificador UUID (versión 7 generado por la aplicación, ADR-010).
    Fecha:
      type: string
      format: date
      description: Fecha calendario ISO-8601 (AAAA-MM-DD); las fechas contables son de hora de El Salvador.
    FechaHora:
      type: string
      format: date-time
      description: Instante ISO-8601 en UTC.
    ErrorCampo:
      type: object
      description: Detalle de un error de validación asociado a un campo.
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          description: Ruta del campo con error dentro del cuerpo o de los parámetros.
        mensaje:
          type: string
          description: Mensaje de error en español.
    ProblemDetails:
      type: object
      description: Error según RFC 9457 (application/problem+json) con extensiones de Pilot.
      required: [type, title, status, codigo]
      properties:
        type:
          type: string
          description: URI que identifica el tipo de problema; about:blank si no hay uno específico.
        title:
          type: string
          description: Resumen corto del problema, en español.
        status:
          type: integer
          description: Código de estado HTTP de la respuesta.
        detail:
          type: string
          description: Explicación del problema para esta ocurrencia; sin trazas ni datos internos.
        instance:
          type: string
          description: URI o identificador de la ocurrencia concreta del problema.
        codigo:
          type: string
          pattern: '^(PLT|CON|INT)-\d{3}$'
          description: Código de negocio con prefijo del módulo (PLT plataforma, CON contabilidad, INT integración).
        errores:
          type: array
          description: Errores de validación por campo; solo en fallos de validación.
          items:
            $ref: '#/components/schemas/ErrorCampo'
        diferencia:
          $ref: '#/components/schemas/MontoConSigno'
          description: Diferencia Σ Debe − Σ Haber; solo en descuadres y cobros que no cuadran.
    PaginaCursor:
      type: object
      description: Metadatos de paginación por cursor; los listados lo extienden con su arreglo de elementos.
      properties:
        siguienteCursor:
          type: [string, 'null']
          description: Cursor opaco para pedir la página siguiente; nulo cuando no hay más resultados.
    # --- Enumeraciones con nombre (se reutilizan en lugar de repetirse en línea) ---
    Rol:
      type: string
      enum: [admin_empresa, contador, auditor]
      description: Rol del usuario dentro de la empresa (CLAUDE.md §14.2). El rol técnico integracion no aplica a usuarios.
    TipoEmpresa:
      type: string
      enum: [PERSONAL, JURIDICA]
      description: Tipo de empresa; en 1.0 solo existe PERSONAL, JURIDICA es de la edición Enterprise (ADR-029).
    EdicionAplicacion:
      type: string
      enum: [COMUNITARIA, ENTERPRISE]
      description: Edición a la que pertenece la app; solo las COMUNITARIA se pueden instalar en 1.0 (ADR-030).
    EstadoAplicacion:
      type: string
      enum: [INSTALADA, DISPONIBLE, BLOQUEADA_ENTERPRISE]
      description: Estado de la app para la empresa activa (ADR-030).
    EstadoEmpresa:
      type: string
      enum: [ACTIVA, INACTIVA]
      description: Estado de la empresa; coincide con el CHECK de la columna estado en la base de datos.
    AlcanceApiKey:
      type: string
      enum: ['integracion:operaciones']
      description: Alcance que otorga una API key; en 1.0 solo el webhook de operaciones de n8n.

    # --- Usuario actual (ADR-028) ---
    Membresia:
      type: object
      description: Pertenencia activa del usuario a una empresa con su rol.
      required: [empresaId, nombreEmpresa, tipoEmpresa, rol]
      properties:
        empresaId:
          $ref: '#/components/schemas/Uuid'
        nombreEmpresa:
          type: string
          description: Nombre de la empresa.
        tipoEmpresa:
          $ref: '#/components/schemas/TipoEmpresa'
        rol:
          $ref: '#/components/schemas/Rol'
    UsuarioActual:
      type: object
      description: Usuario autenticado y sus membresías activas.
      required: [id, correo, nombre, telefono, recomendacionesCorreo, membresias]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        correo:
          type: string
          description: Correo del usuario, verificado en Keycloak (dato personal; se enmascara en logs).
        nombre:
          type: string
          description: Nombre completo del usuario.
        telefono:
          type: string
          pattern: '^\+503[0-9]{8}$'
          description: Teléfono de El Salvador con prefijo +503 (dato personal; se enmascara en logs).
        recomendacionesCorreo:
          type: boolean
          description: Consentimiento vigente para recibir recomendaciones por correo (ADR-028).
        membresias:
          type: array
          description: Empresas a las que el usuario pertenece con membresía activa.
          items:
            $ref: '#/components/schemas/Membresia'
    ActualizacionUsuarioActual:
      type: object
      description: Cambio del consentimiento de correos; nombre, correo y teléfono vienen de Keycloak y no se editan aquí.
      required: [recomendacionesCorreo]
      properties:
        recomendacionesCorreo:
          type: boolean
          description: true da el consentimiento; false lo retira.

    # --- Empresa (ADR-029) ---
    Empresa:
      type: object
      description: >-
        Espacio de trabajo activo de la sesión. En la versión abierta es la empresa PERSONAL del usuario, sin datos
        empresariales (ADR-032).
      required: [id, tipo, nombre, estado, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoEmpresa'
        nombre:
          type: string
          description: Nombre del espacio de trabajo; al crearlo es el nombre del usuario.
        estado:
          $ref: '#/components/schemas/EstadoEmpresa'
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
    ActualizacionEmpresa:
      type: object
      description: >-
        Dato editable del espacio de trabajo: solo el nombre. Nombre comercial, NIT y NRC no se capturan en la
        versión abierta (ADR-031, ADR-032); son de la edición Enterprise.
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 250
          description: Nuevo nombre del espacio de trabajo.

    # --- Catálogo de apps (ADR-030) ---
    AplicacionCatalogo:
      type: object
      description: App del catálogo con su estado para la empresa activa.
      required: [codigo, nombre, descripcion, edicion, estado, instaladaEn]
      properties:
        codigo:
          type: string
          description: Identificador estable de la app; también es el prefijo de sus rutas.
        nombre:
          type: string
          description: Nombre visible de la app.
        descripcion:
          type: [string, 'null']
          description: Descripción corta de la app.
        edicion:
          $ref: '#/components/schemas/EdicionAplicacion'
        estado:
          $ref: '#/components/schemas/EstadoAplicacion'
        instaladaEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de la instalación (FechaHora); nulo si la app no está instalada.

    # --- API keys (secreto visible solo al crearlas) ---
    ApiKey:
      type: object
      description: API key de integración. Nunca incluye el secreto ni su hash.
      required: [id, nombre, prefijo, alcances, expiraEn, revocadaEn, ultimoUsoEn, creadaEn]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          description: Nombre descriptivo, p. ej. "n8n producción".
        prefijo:
          type: string
          description: Parte visible de la clave (pk_xxxx) para identificarla.
        alcances:
          type: array
          description: Alcances que otorga la clave.
          items:
            $ref: '#/components/schemas/AlcanceApiKey'
        expiraEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de expiración (FechaHora); nulo si no vence.
        revocadaEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de revocación (FechaHora); nulo si está vigente.
        ultimoUsoEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC del último uso (FechaHora); nulo si nunca se usó.
        creadaEn:
          $ref: '#/components/schemas/FechaHora'
    PaginaApiKeys:
      description: Página de API keys sin secretos.
      allOf:
        - $ref: '#/components/schemas/PaginaCursor'
        - type: object
          required: [elementos]
          properties:
            elementos:
              type: array
              description: API keys de la página.
              items:
                $ref: '#/components/schemas/ApiKey'
    NuevaApiKey:
      type: object
      description: Datos para crear una API key.
      required: [nombre, alcances, expiraEn]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre descriptivo de la clave.
        alcances:
          type: array
          minItems: 1
          description: >-
            Alcances que tendrá la clave. Sin repetidos: el backend rechaza duplicados con 422 PLT-002.
          items:
            $ref: '#/components/schemas/AlcanceApiKey'
        expiraEn:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de expiración (FechaHora); null para una clave que no vence.
    ApiKeyCreada:
      description: API key recién creada; es la única respuesta que incluye el secreto.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secreto]
          properties:
            secreto:
              type: string
              description: >-
                Secreto completo (pk_xxxx.secreto). Se muestra una sola vez y no se puede recuperar;
                el servidor guarda únicamente su hash Argon2id.

    # --- Contabilidad: enumeraciones y catálogo de cuentas (CLAUDE.md §10.2, ADR-035) ---
    ModoPrecio:
      type: string
      enum: [CON_IVA, SIN_IVA]
      description: >-
        Cómo se interpreta un monto: CON_IVA (el monto incluye IVA) o SIN_IVA (el IVA se suma). Solo cambia la
        interpretación, no las tasas (ADR-015).
    NaturalezaCuenta:
      type: string
      enum: [DEUDORA, ACREEDORA]
      description: Naturaleza de la cuenta; deudora aumenta con el Debe (clases 1 y 4), acreedora con el Haber (2, 3 y 5).
    TipoOperacionContable:
      type: string
      enum: [CIERRE_INGRESOS_DIARIO]
      description: Tipo de operación externa contabilizable; en 1.0 solo el cierre de ingresos diarios (ADR-017).
    CategoriaRegla:
      type: string
      enum: [INGRESO, COBRO]
      description: Categoría de la regla; INGRESO es un concepto de venta y COBRO una forma de pago (ADR-020).
    ResumenCuenta:
      type: object
      description: Referencia corta a una cuenta contable, para mostrarla dentro de otros recursos.
      required: [id, codigo, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          description: Código de la cuenta.
        nombre:
          type: string
          description: Nombre de la cuenta.
    CuentaContable:
      type: object
      description: Cuenta del catálogo de la empresa; también viaja su versión como ETag.
      required: [id, codigo, nombre, clase, nivel, cuentaPadreId, naturaleza, aceptaMovimientos, activa, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          description: Código de la cuenta; su primer dígito es la clase.
        nombre:
          type: string
          description: Nombre de la cuenta.
        clase:
          type: integer
          minimum: 1
          maximum: 5
          description: Clase de la cuenta (primer dígito del código) 1 Activo, 2 Pasivo, 3 Capital, 4 Costos y Gastos, 5 Ingresos.
        nivel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel por longitud del código, 1 clase, 2 grupo, 3 cuenta, 4 subcuenta, 5 detalle.
        cuentaPadreId:
          type: [string, 'null']
          format: uuid
          description: Cuenta padre (su código es prefijo del de esta cuenta); nulo en las clases.
        naturaleza:
          $ref: '#/components/schemas/NaturalezaCuenta'
        aceptaMovimientos:
          type: boolean
          description: true solo en las cuentas de detalle, sin hijas; únicas que aceptan movimientos.
        activa:
          type: boolean
          description: Si la cuenta está activa; una cuenta inactiva no acepta movimientos.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
    NuevaCuentaContable:
      type: object
      description: >-
        Datos para crear una cuenta. La cuenta padre no se envía porque se deduce del código (ADR-035). El patrón
        del código no exige la clase para que la regla de negocio responda CON-010 y CON-015.
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          pattern: '^[0-9]{1,8}$'
          description: Código de 1 a 8 dígitos; su primer dígito debe ser una clase de 1 a 5 (CON-010).
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          description: Nombre de la cuenta.
        naturaleza:
          $ref: '#/components/schemas/NaturalezaCuenta'
          description: Naturaleza de la cuenta; si se omite se usa la de su clase.
    ActualizacionCuentaContable:
      type: object
      description: Campos editables de una cuenta; solo se envían los que cambian y debe venir al menos uno.
      minProperties: 1
      properties:
        codigo:
          type: string
          pattern: '^[0-9]{1,8}$'
          description: Nuevo código; no puede cambiarse si la cuenta tiene movimientos (CON-011).
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          description: Nuevo nombre de la cuenta.
        naturaleza:
          $ref: '#/components/schemas/NaturalezaCuenta'
          description: Nueva naturaleza, para cuentas complementarias.
        activa:
          type: boolean
          description: false desactiva la cuenta (CON-012 si tiene saldo, CON-016 si está en uso); true la reactiva.

    # --- Configuración contable (CLAUDE.md §11.3) ---
    ConfiguracionContable:
      type: object
      description: Configuración contable de la empresa; también viaja su versión como ETag.
      required: [modoPrecioDefecto, cuentaIvaDebito, cuentaIvaCredito, version]
      properties:
        modoPrecioDefecto:
          $ref: '#/components/schemas/ModoPrecio'
        cuentaIvaDebito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA débito fiscal (pasivo), usada en las ventas.
        cuentaIvaCredito:
          $ref: '#/components/schemas/ResumenCuenta'
          description: Cuenta de IVA crédito fiscal (activo), usada en las compras.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; también viaja como ETag (CLAUDE.md §8.3).
    ActualizacionConfiguracionContable:
      type: object
      description: Configuración completa que reemplaza a la actual (PUT completo); todos los campos son obligatorios.
      required: [modoPrecioDefecto, cuentaIvaDebitoId, cuentaIvaCreditoId]
      properties:
        modoPrecioDefecto:
          $ref: '#/components/schemas/ModoPrecio'
        cuentaIvaDebitoId:
          $ref: '#/components/schemas/Uuid'
          description: Cuenta de detalle activa para el IVA débito fiscal (CON-006).
        cuentaIvaCreditoId:
          $ref: '#/components/schemas/Uuid'
          description: Cuenta de detalle activa para el IVA crédito fiscal (CON-006).

    # --- Reglas de contabilización (ADR-020, ADR-035) ---
    ReglaContabilizacion:
      type: object
      description: Regla que asigna una cuenta a un código de una operación externa; su versión es el valor de If-Match.
      required: [id, tipoOperacion, categoria, codigo, cuenta, activa, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipoOperacion:
          $ref: '#/components/schemas/TipoOperacionContable'
        categoria:
          $ref: '#/components/schemas/CategoriaRegla'
        codigo:
          type: string
          description: Código del concepto de ingreso o de la forma de pago, p. ej. VENTAS_GRAVADAS o EFECTIVO.
        cuenta:
          oneOf:
            - $ref: '#/components/schemas/ResumenCuenta'
            - type: 'null'
          description: Cuenta de detalle que usa la regla; nula solo si la regla está inactiva (ADR-035).
        activa:
          type: boolean
          description: Si la regla está activa; una regla activa siempre tiene cuenta.
        version:
          type: integer
          format: int64
          description: Versión para concurrencia optimista; se envía entre comillas como If-Match (CLAUDE.md §8.3).
    ActualizacionReglaContabilizacion:
      type: object
      description: Cuenta y estado de una regla (PUT completo); ambos campos son obligatorios.
      required: [cuentaId, activa]
      properties:
        cuentaId:
          type: [string, 'null']
          format: uuid
          description: Cuenta de detalle activa de la regla (CON-006); nula solo si activa es false.
        activa:
          type: boolean
          description: true activa la regla y exige cuentaId (PLT-002 si es nulo); false la desactiva.

  # --- Parámetros reutilizables ---
  parameters:
    XEmpresaId:
      name: X-Empresa-Id
      in: header
      required: true
      description: Empresa activa de la sesión; se valida contra las membresías del usuario (CLAUDE.md §4.5).
      schema:
        $ref: '#/components/schemas/Uuid'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de correlación; se genera si no viene y se devuelve en la respuesta.
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave de idempotencia de la operación; repetir la misma clave con el mismo cuerpo devuelve la respuesta original.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Limite:
      name: limite
      in: query
      required: false
      description: Cantidad máxima de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto como siguienteCursor en la página anterior.
      schema:
        type: string

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión leída del recurso; si no coincide con la actual se responde 412 PLT-016 (CLAUDE.md §8.3).
      schema:
        type: string
        minLength: 1
    EmpresaIdRuta:
      name: empresaId
      in: path
      required: true
      description: Empresa del recurso; debe ser igual al header X-Empresa-Id, si no responde 404 PLT-017.
      schema:
        $ref: '#/components/schemas/Uuid'
    CodigoAplicacion:
      name: codigo
      in: path
      required: true
      description: Código estable de la app del catálogo (p. ej. contabilidad).
      schema:
        type: string
        minLength: 1
        maxLength: 40
    ApiKeyIdRuta:
      name: apiKeyId
      in: path
      required: true
      description: Identificador de la API key.
      schema:
        $ref: '#/components/schemas/Uuid'

    CuentaIdRuta:
      name: cuentaId
      in: path
      required: true
      description: Identificador de la cuenta contable.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReglaIdRuta:
      name: reglaId
      in: path
      required: true
      description: Identificador de la regla de contabilización.
      schema:
        $ref: '#/components/schemas/Uuid'
    BusquedaCuenta:
      name: busqueda
      in: query
      required: false
      description: Texto a buscar en el código o el nombre de la cuenta, sin distinguir mayúsculas.
      schema:
        type: string
        maxLength: 100
    SoloDetalle:
      name: soloDetalle
      in: query
      required: false
      description: true devuelve solo las cuentas de detalle (las que aceptan movimientos).
      schema:
        type: boolean
        default: false
    SoloActivas:
      name: soloActivas
      in: query
      required: false
      description: true omite las cuentas inactivas.
      schema:
        type: boolean
        default: false
    TipoOperacionFiltro:
      name: tipoOperacion
      in: query
      required: false
      description: Limita las reglas a un tipo de operación.
      schema:
        $ref: '#/components/schemas/TipoOperacionContable'

  # --- Headers reutilizables ---
  headers:
    X-Request-Id:
      description: Identificador de correlación de la petición, para soporte y trazas.
      schema:
        type: string
    ETag:
      description: Versión del recurso (su columna version) entre comillas; se envía como If-Match al editarlo.
      schema:
        type: string
    Idempotency-Replayed:
      description: Vale true cuando la respuesta es la guardada de una petición idempotente repetida.
      schema:
        type: boolean
    Retry-After:
      description: Segundos que el cliente debe esperar antes de reintentar.
      schema:
        type: integer

  # --- Respuestas de error reutilizables (RFC 9457) ---
  responses:
    SolicitudInvalida:
      description: 400 — El cuerpo o los parámetros no cumplen el contrato (incluye la lista errores).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoAutenticado:
      description: 401 — Falta la credencial o es inválida, está vencida o fue revocada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Prohibido:
      description: 403 — La credencial es válida pero no tiene rol, alcance o app activa para esta operación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoEncontrado:
      description: 404 — El recurso no existe o no pertenece a la empresa activa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflicto:
      description: 409 — El estado actual del recurso impide la operación (duplicado o petición en proceso).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PrecondicionFallida:
      description: 412 — El header If-Match no coincide con la versión actual del recurso; volver a leerlo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    EntidadNoProcesable:
      description: 422 — La petición es válida en forma pero viola una regla de negocio (incluye diferencia si aplica).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PrecondicionRequerida:
      description: 428 — Falta un header obligatorio de precondición, como Idempotency-Key o If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DemasiadasPeticiones:
      description: 429 — Se superó el límite de peticiones; ver el header Retry-After.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErrorInterno:
      description: 500 — Error interno; no expone trazas ni mensajes internos. Reintentar es seguro con idempotencia.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
