<html xmlns:th="http://www.thymeleaf.org">
<!-- Plantilla PDF del Libro Mayor / auxiliar de una cuenta (CLAUDE.md 10.5, ADR-038 §5). El saldo acumulado línea
     a línea ya viene calculado por dominio.estados.LibroMayor; la plantilla solo lo presenta. -->
<head>
  <meta charset="UTF-8" />
  <style>
    @page { size: letter; margin: 2cm 1.4cm;
      @bottom-center { content: "Página " counter(page) " de " counter(pages); font-size: 8px; color: #666; } }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 9px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 2px 0; }
    .meta { font-size: 8px; color: #555; margin-bottom: 8px; }
    .cuenta { font-size: 11px; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 2px 4px; text-align: left; }
    th { background: #eee; }
    .num { text-align: right; white-space: nowrap; }
    .total-row td { font-weight: bold; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1 th:text="${titulo}">Libro Mayor</h1>
  <p class="meta">
    <span th:text="${periodo}">Período</span> — Generado el <span th:text="${generadoEn}">fecha</span>
  </p>
  <!-- Cuenta consultada (de detalle o padre, ADR-038 §5) y su saldo inicial. Un solo th:text con toda la frase:
       varios <span> hermanos en el mismo párrafo se pintan fuera de orden en el flujo de texto del PDF
       (OpenHTMLtoPDF pinta primero el texto literal y después los span, aunque el layout visual sea correcto). -->
  <p class="cuenta"
     th:text="${mayor.cuenta().codigo().valor()} + ' — ' + ${mayor.cuenta().nombre()} + ' (' + ${mayor.naturaleza()}
               + ') · Saldo inicial: ' + ${mayor.saldoInicial().monto()} + ' ' + ${mayor.saldoInicial().lado()}">
    código — nombre (naturaleza) · Saldo inicial: 0.00 DEUDOR
  </p>
  <table>
    <thead>
      <tr>
        <th>Fecha</th><th>Año</th><th>Número</th><th>Concepto</th><th>Descripción</th><th>Código</th><th>Cuenta</th>
        <th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th><th>Lado</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="mov : ${mayor.movimientos()}">
        <td th:text="${mov.linea().fecha()}"></td>
        <td th:text="${mov.linea().anio()}"></td>
        <td th:text="${mov.linea().numero()}"></td>
        <td th:text="${mov.linea().concepto()}"></td>
        <td th:text="${mov.linea().descripcion()}"></td>
        <td th:text="${mov.linea().cuenta().codigo().valor()}"></td>
        <td th:text="${mov.linea().cuenta().nombre()}"></td>
        <td class="num" th:text="${mov.linea().debe()}"></td>
        <td class="num" th:text="${mov.linea().haber()}"></td>
        <td class="num" th:text="${mov.saldo().monto()}"></td>
        <td th:text="${mov.saldo().lado()}"></td>
      </tr>
    </tbody>
    <tfoot>
      <tr class="total-row">
        <td colspan="7">TOTALES</td>
        <td class="num" th:text="${mayor.totalDebe()}"></td>
        <td class="num" th:text="${mayor.totalHaber()}"></td>
        <td colspan="2"></td>
      </tr>
    </tfoot>
  </table>
  <!-- Saldo final rotulado aparte (como el saldo inicial arriba): la fila TOTALES ya alcanza el ancho de la página
       con 11 columnas y mezclar ahí el saldo final sin su propia etiqueta dificulta leerlo. Un solo th:text, por
       la misma razón que el párrafo de arriba. -->
  <p class="cuenta"
     th:text="'Saldo final: ' + ${mayor.saldoFinal().monto()} + ' ' + ${mayor.saldoFinal().lado()}">
    Saldo final: 0.00 DEUDOR
  </p>
</body>
</html>
