# Configuración base de Pilot (común a todos los perfiles). Sin secretos: solo variables de entorno.
spring:
  application:
    name: pilot

  # Perfil de ejecución por defecto: api (CLAUDE.md 4.1; el perfil worker está diferido)
  profiles:
    default: api

  # JPA: sin sesión abierta en la vista y esquema controlado solo por Flyway
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Fechas-hora hacia/desde JDBC siempre en UTC (TIMESTAMPTZ)
        jdbc:
          time_zone: UTC

# Logs estructurados JSON nativos de Spring Boot (CLAUDE.md 16.4). El formato logstash incluye todo el MDC
# (traceId, y empresaId/usuarioId/modulo cuando el contexto de empresa los publique en F0-06).
logging:
  structured:
    format:
      console: logstash

# Pilot: seguridad y CORS (CLAUDE.md 4.5 y 14). Sin secretos: el emisor OIDC es una URL pública y viene del entorno.
pilot:
  seguridad:
    # Emisor OIDC (Keycloak, ADR-008). Sin valor por defecto a propósito: si falta, la aplicación no arranca y no
    # queda un emisor equivocado en producción. En dev se define en application-dev.yml.
    emisor: ${PILOT_OIDC_ISSUER}
    # Audiencia que debe traer el token de acceso (mapeador "audiencia-pilot-api" del realm)
    audiencia: pilot-api
  cors:
    # Orígenes del frontend autorizados a llamar a la API; vacío = ninguno (lista separada por comas)
    origenes: ${PILOT_CORS_ORIGENES:}
