# Dependabot de Pilot 1.0: actualizaciones semanales por ecosistema (CLAUDE.md §14.1).
version: 2
updates:
  # Dependencias y plugins de Maven del backend
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly

  # Dependencias del frontend; Dependabot lee pnpm-lock.yaml bajo el ecosistema npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  # Acciones de GitHub fijadas por SHA (Dependabot actualiza SHA y comentario de versión)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imágenes del compose de desarrollo (F1-09).
  # El ecosistema "docker" solo lee Dockerfile/Containerfile y YAML de Kubernetes, por eso
  # fallaba con infra/docker/compose.dev.yml; "docker-compose" sí lo lee: su FILENAME_REGEX
  # /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i acepta "compose.dev.yml"
  # (dependabot-core, docker/lib/dependabot/docker_compose/file_fetcher.rb).
  # Ecosistema en GA desde 2025-02-25:
  # https://github.blog/changelog/2025-02-25-dependabot-version-updates-now-support-docker-compose-in-general-availability/
  # Opciones: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
